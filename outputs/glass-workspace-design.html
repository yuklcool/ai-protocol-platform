function frameDoc(page){const nav=[['工作区',[['chat','chat','对话工作台']]],['智能体',[['root','spark','Root Agent 设置']]],['资源',[['skills','spark','技能管理'],['models','box','模型服务'],['mcp','plug','MCP 服务']]],['管理',[['users','user','用户管理'],['usage','chart','用量统计'],['audit','file','审计日志']]]];return '<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>'+css+'</style></head><body><div class="shade" id="shade"></div><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><span class="mark">'+icon('spark')+'</span><div class="grow"><b>AI Protocol Platform</b><p>统一智能体运行时</p></div><button class="btn ghost iconbtn mobileclose" id="close" aria-label="关闭导航">'+icon('close')+'</button></div><nav class="nav">'+nav.map(([label,items])=>'<label>'+label+'</label>'+items.map(([key,ico,text])=>'<button data-jump="'+key+'"'+(key===page?' class="active" aria-current="page"':'')+'>'+icon(ico)+text+'</button>').join('')).join('')+'</nav><div class="sidebar-foot"><button class="btn ghost" data-jump="system">'+icon('settings')+'设计系统</button><div class="profile"><span class="avatar">演</span><div class="grow"><b class="small">演示用户</b><p class="small muted">设计评审 · 不含真实账号</p></div></div><div class="runtime">'+icon('spark')+'<div><b class="small">Root Agent</b><p class="small muted">模型与能力由平台配置</p></div></div></div></aside><main class="main"><div class="mobilebar"><button class="btn ghost iconbtn" id="menu" aria-label="打开导航">'+icon('menu')+'</button><span class="grow">AI Protocol Platform</span>'+tag('示意稿')+'</div>'+screens[page]()+'</main></div><script>('+bind.toString()+')();<'+ '/script></body></html>';}
function bind(){const $=(s)=>document.querySelector(s);let timer;function toast(text){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=text;document.body.appendChild(t);clearTimeout(timer);timer=setTimeout(()=>t.remove(),3400);}document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>parent.postMessage({kind:'design-page',page:b.dataset.jump},'*'));document.querySelectorAll('[data-demo]').forEach(b=>b.onclick=e=>{e.preventDefault();toast('仅演示交互反馈，未执行保存、测试或模型调用。');});const search=$('[data-search]');if(search)search.oninput=()=>{let n=0;document.querySelectorAll('[data-filter]').forEach(el=>{const match=el.textContent.toLowerCase().includes(search.value.trim().toLowerCase());el.hidden=!match;if(match)n++;});if($('#no-results'))$('#no-results').hidden=!!n;};document.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('#draft').value=b.dataset.prompt;$('#draft').focus();});const form=$('#sendform');if(form){const send=e=>{e.preventDefault();const input=$('#draft');if(!input.value.trim())return;const welcome=$('#welcome');welcome.innerHTML='';welcome.style.justifyContent='flex-end';const message=document.createElement('div');message.className='message';message.textContent=input.value;welcome.appendChild(message);const note=document.createElement('p');note.textContent='设计演示：消息未发送给模型，也未保存为会话。';welcome.appendChild(note);input.value='';toast('已演示输入反馈，未调用任何服务。');};form.onsubmit=send;$('#draft').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing)send(e);};$('[data-new]').onclick=()=>parent.postMessage({kind:'design-page',page:'chat'},'*');}document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{toast('此处展示分区导航的视觉规范；生产界面保留真实分区内容。');});let returnFocus=null;function close(){ $('#sidebar').classList.remove('open');$('#shade').classList.remove('open');returnFocus?.focus();}if($('#menu'))$('#menu').onclick=()=>{returnFocus=$('#menu');$('#sidebar').classList.add('open');$('#shade').classList.add('open');$('#close').focus();};$('#close').onclick=close;$('#shade').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&$('#sidebar').classList.contains('open')){const nodes=[...$('#sidebar').querySelectorAll('button,a,input')].filter(n=>!n.disabled);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});}
const iframe=document.getElementById('preview');function openPage(page){if(!screens[page]){page=page==='mcp'?'models':'usage';}document.querySelectorAll('#pages button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));iframe.srcdoc=frameDoc(page);}document.querySelectorAll('#pages button').forEach(b=>b.onclick=()=>openPage(b.dataset.page));document.querySelectorAll('#sizes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#sizes button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));iframe.style.width=b.dataset.width==='100%'?'100%':b.dataset.width+'px';});window.addEventListener('message',e=>{if(e.source===iframe.contentWindow&&e.data?.kind==='design-page')openPage(e.data.page);});openPage('chat');
</script>
