function showEnergyEvidence(){showDrawer('能耗变化 · 拆分依据',`${sourceNote('对比 10-25 18:00–10-26 07:00 与前一夜同窗口。')}<section><h3>先确定是同一批灯</h3><p>仅纳入两晚均有有效能耗、亮灯时长且前夜时长大于 0 的单灯，按单灯 ID 配对。演示可比样本 12,000 盏；样本外对象单独说明，不用缺失补零。</p></section>${evidence([['可比样本增量','464.8 kWh','同一批灯，两晚同窗口'],['时长贡献','340.0 kWh','逐灯计算后求和'],['非时长贡献','124.8 kWh','实际增量减时长贡献']])}<section><h3>拆分方法</h3><p>每盏灯以前夜“每亮灯小时耗电”作为基线，乘以本夜亮灯小时变化，得到时长贡献。实际耗电增量减去时长贡献，剩余部分归为非时长贡献。</p><p>非时长贡献可能涉及调光、实际带载、计量或资产变化；它不是一个可以直接命名为“故障耗电”的指标。</p></section><section><h3>还需要披露的内容</h3><p>可比样本覆盖、排除原因、前夜时长为 0 的对象、样本外差额和未解释残差。额定功率是配置值，不能替代实测功率。</p></section><div class="drawer-foot">${action('energy-object','核查高值单灯','high',true)}${action('energy-object','核查长时低耗单灯','low')}</div>`);}

function showReport(){if(['error','empty'].includes(state.dataState)){toast('当前没有可用结果，不能生成成功报告。');return;}const sections=reportSections();showDrawer(`${state.scene==='rtu'?'RTU':'单灯'}运行报告 · 结构演示`,`${sourceNote('沿用服务器的固定章节顺序。这里只演示阅读结构，未预置字段明确标为待取得。')}${state.dataState==='partial'?'<div class="notice">部分历史电参缺失，报告必须保留证据缺口，不形成完整根因结论。</div>':''}${sections.map(x=>`<section class="report-section"><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></section>`).join('')}<p class="fineprint">正式结果先回到聊天；用户要求附件时，再调用现有 Word 技能生成成品。这里不生成伪装成 Word 的文件。</p><div class="drawer-foot">${action('report-text','下载章节示例 TXT')}</div>`);}
function downloadText(name,text,type='text/plain;charset=utf-8'){const url=URL.createObjectURL(new Blob(['\uFEFF',text],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvCell(value){let text=String(value??'');if(typeof value==='string'&&/^[=+@-]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"';}
function exportRows(){if(['error','empty'].includes(state.dataState)){toast('当前查询没有可导出的成功结果。');return;}let rows,headers;
 if(state.scene==='night'||state.scene==='lampalarms'){headers=['单灯','道路','RTU','回路','问题线索','07:00已解除','触发次数','亮灯分钟','额定功率W','夜间kWh'];rows=(state.scene==='night'?lamps.slice(0,4):lampAlarmRows()).map(l=>[l.id,l.road,l.rtu,l.circuit,l.kind,l.restored?'是':'否',l.events,l.minutes,l.watts,l.kwh]);}
 if(state.scene==='rtu'){headers=['RTU','名称','07:00状态','末次上报','支路数','关联异常灯数'];rows=rtuRows().map(r=>[r.id,r.name,r.status,r.last,r.circuits,r.affected]);}
 if(state.scene==='rtualarms'){headers=['报警ID','RTU','类型','位置','发生时间','07:00状态','历史证据'];rows=rtuAlarmRows().map(r=>[r.id,r.rtu,r.kind,r.phase,r.time,r.status,state.dataState==='partial'?'历史电参暂不可用':r.reading]);}
 if(state.scene==='reconcile'){headers=['自然日','RTU','灯杆数','灯源数','单灯kWh','RTU kWh','差额kWh','比值','状态'];rows=reconcileRows().map(r=>['2026-10-25',r.rtu,r.poles,r.lamps,r.lamp,r.rtuEnergy,r.rtuEnergy==null?'':Number((r.lamp-r.rtuEnergy).toFixed(2)),r.rtuEnergy>0?Number((r.lamp/r.rtuEnergy).toFixed(6)):'',r.rtuEnergy==null?'缺失':r.rtuEnergy===0?'分母为0':'倒挂']);}
 if(state.scene==='energy'){
  if(state.energyTab==='night'){headers=['夜间窗口','对象','kWh','亮灯分钟','额定功率W'];rows=[['2026-10-25 18:00 至 2026-10-26 07:00','L-2031-A',4.8,668,150],['2026-10-25 18:00 至 2026-10-26 07:00','L-2104-A',.02,610,150]];}
  else if(state.energyTab==='volatility'){headers=['自然日','RTU','当日kWh','前日kWh','变化kWh','增幅%'];rows=fluctuations.map(r=>['2026-'+r.date,r.rtu,r.after,r.before,r.after-r.before,Number(((r.after-r.before)/r.before*100).toFixed(2))]);}
  else if(state.energyTab==='saving'){headers=['自然日','理论kWh','实际kWh','计算节能率%','系统记录节能率%'];rows=daily.map((d,i)=>['2026-'+d.date,18000,d.energy,Number(((18000-d.energy)/18000*100).toFixed(2)),i===6?0:Number(((18000-d.energy)/18000*100).toFixed(2))]);}
  else {headers=['自然日','实际kWh'];rows=daily.map(d=>['2026-'+d.date,d.energy]);}
 }
 const csv=[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');downloadText(`DEMO-${state.scene}-${state.scene==='energy'?state.energyTab+'-':''}2026-10-26.csv`,csv,'text/csv;charset=utf-8');toast('已下载当前演示清单；空白单元格代表缺失，不是 0。');
}
function submitPrompt(text){const value=text.trim();if(!value){toast('请输入要继续查询的问题。');return;}
 const rules=[['reconcile',/倒挂|对账|比RTU|比 RTU|合计.*(高|大)/i],['energy',/能耗|用电|节能|耗电/],['rtualarms',/(RTU|控制箱).*(报警|告警|缺相|过流|漏电|断路)|(报警|告警).*(RTU|控制箱)/i],['rtu',/RTU|控制箱|支路/i],['lampalarms',/报警|告警|未解除|没解除|同回路|集中|离线/],['night',/单灯|整夜|昨晚|昨夜|运行|亮灯/]];
 const found=rules.find(r=>r[1].test(value));if(!found){state.draft=value;$('#prompt').value=value;toast('此原型只演示六类预置照明查询；问题已保留为草稿，未调用模型。');return;}
 // shortcut: keyword routing selects fixed demo scenes; production must use validated agent intent and real query results.
 if($('#drawer').open)$('#drawer').close();switchScene(found[0]);if(found[0]==='energy'){state.energyTab=/节能/.test(value)?'saving':/30|波动/.test(value)?'volatility':/7|七|一周/.test(value)?'week':'night';}state.extraPrompt=value;state.draft='';$('#prompt').value='';renderChat();renderResult();toast('已切换到对应的预置场景；显示的仍是固定演示数据。');
}
document.addEventListener('click',event=>{
 const b=event.target.closest('button');if(!b)return;
 if(b.dataset.scene){if($('#drawer').open)$('#drawer').close();switchScene(b.dataset.scene);return;}
 if(b.dataset.energyTab){state.energyTab=b.dataset.energyTab;state.dataState='ready';state.extraPrompt='';renderChat();renderResult();return;}
 const value=b.dataset.value||'';
 const handlers={
  close:()=>$('#drawer').close(),sources:showSources,method:showMethod,definitions:showDefinitions,parameters:()=>showParameters(value),chat:showChat,
  lamp:()=>showLamp(value),batch:showBatch,rtu:()=>showRtu(value),'rtu-alarm':()=>showRtuAlarm(value),'energy-evidence':showEnergyEvidence,'energy-object':()=>showEnergyObject(value),fluctuation:()=>showFluctuation(value),reconcile:()=>showReconcile(value),'day-energy':()=>showDay(value),
  'circuit-kind':()=>showDrawer('回路断路 · 确认灯具类型后的路径',`<p>${value==='decorative'?'如果确认为亮化灯：结束这条回路断路技能路径，但不能据此认定正常或误报；需要按亮化控制策略另查。':'如果确认为非亮化道路灯：继续取得连续回路电流样本，先核对“小于 3 A 且频繁波动”，再按技能检查报警前电流和总电流。'}</p><div class="notice neutral">此选择只演示分支说明，没有修改台账或执行现场操作。</div><div class="drawer-foot">${action('rtu-alarm','返回这条断路报警','RA-004')}</div>`),
  downstream:()=>{if($('#drawer').open)$('#drawer').close();switchScene('lampalarms',value);},
  'downstream-alarm':()=>{const alarm=rtuAlarms.find(a=>a.id===value);if(!alarm)return;if($('#drawer').open)$('#drawer').close();switchScene('lampalarms',alarm.rtu);state.alarmAnchor=alarm;state.filter='all';renderChat();renderResult();},
  'rtu-alarm-list':()=>{if($('#drawer').open)$('#drawer').close();switchScene('rtualarms',value);},
  'reconcile-only':()=>{if($('#drawer').open)$('#drawer').close();switchScene('reconcile',value);},
  'clear-rtu':()=>{state.rtuFilter='';state.alarmAnchor=null;renderChat();renderResult();},retry:()=>{state.dataState='ready';renderChat();renderResult();toast('已恢复有数据的演示状态；未发送真实请求。');},report:showReport,export:exportRows,
  'report-text':()=>{const text=`${state.scene==='rtu'?'RTU':'单灯'}运行报告 · 章节结构演示\n全部为合成数据；未预置字段保持待取得。\n2026-10-25 18:00 至 2026-10-26 07:00，Asia/Shanghai\n\n`+reportSections().map(s=>s.join('\n')).join('\n\n');downloadText('DEMO-lighting-report-structure.txt',text);toast('已下载章节结构示例，不是生产报告。');}
 };
 if(handlers[b.dataset.action])handlers[b.dataset.action]();
});
document.addEventListener('change',event=>{if(event.target.id==='record-filter'){state.filter=event.target.value;renderResult();}if(event.target.id==='demo-state'){state.dataState=event.target.value;renderResult();renderChat();}});
document.addEventListener('input',event=>{if(event.target.id==='prompt'||event.target.id==='drawer-prompt')state.draft=event.target.value;if(event.target.id==='record-query'){const start=event.target.selectionStart;state.query=event.target.value;const scroll=$('#result').scrollTop;renderResult();const input=$('#record-query');input.focus();if(start!=null)input.setSelectionRange(start,start);$('#result').scrollTop=scroll;}});
document.addEventListener('submit',event=>{
 if(event.target.id==='composer'){event.preventDefault();submitPrompt($('#prompt').value);}
 if(event.target.id==='drawer-composer'){event.preventDefault();submitPrompt($('#drawer-prompt').value);}
 if(event.target.id==='parameter-form'){event.preventDefault();const data=new FormData(event.target),start=String(data.get('start')),end=String(data.get('end'));if(end<=start){toast('结束时间必须晚于开始时间。请修正后再放入草稿。');return;}const object=String(data.get('object'));if(['能耗对账','RTU能耗（日）'].includes(object)&&(start.slice(11)!=='00:00'||end.slice(11)!=='00:00')){toast('日报采用自然日，请把起止时间设为相应日期的 00:00。');return;}state.draft=`查询${data.get('scope')}的${object}，时间为 ${start.replace('T',' ')} 至 ${end.replace('T',' ')}（Asia/Shanghai）。`;$('#prompt').value=state.draft;$('#drawer').close();if(matchMedia('(max-width:1000px)').matches)showChat();else $('#prompt').focus();toast('查询参数已放入草稿；尚未发送，当前演示结果保持原口径。');}
});
$('#prompt').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('#composer').requestSubmit();}});
$('#drawer').addEventListener('click',event=>{if(event.target===$('#drawer')){const rect=$('#drawer').getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)$('#drawer').close();}});
$('#brand-icon').innerHTML=icon('lamp');$('#send-icon').innerHTML=icon('up');render();
</script>
