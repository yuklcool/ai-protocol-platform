name: Self-host release images

on:
  pull_request:
    paths:
      - docker-compose.yml
      - docker-compose.release.yml
      - .env.selfhost.example
      - README.md
      - docs/selfhost-release-images.md
      - backend/Dockerfile
      - backend/db/migrations/**
      - backend/scripts/apply_selfhost_migrations.py
      - frontend/Dockerfile
      - frontend/docker-entrypoint.sh
      - infrastructure/mcp-sandbox/**
      - scripts/smoke-selfhost.sh
      - .github/workflows/release-images.yml
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

concurrency:
  group: selfhost-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io

jobs:
  release-gate:
    name: Release self-host gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AUTH_BACKEND: local-jwt
      JWT_SIGNING_KEY: release-ci-signing-key-at-least-32-bytes-long
      JWT_ISSUER: ai-protocol-platform-release-ci
      JWT_AUDIENCE: ai-protocol-platform-release-ci
      SELFHOST_ADMIN_EMAIL: admin@example.com
      SELFHOST_ADMIN_PASSWORD: release-ci-admin-password
      PLATFORM_DEFAULT_MODEL: gpt-5-6-terra
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_API_BASE: http://model-gateway.invalid/v1
      SKIP_QUALITY_CHECKS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            echo "Expected a stable SemVer tag such as v1.2.3" >&2
            exit 1
          fi

      - name: Validate source and release Compose models
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.release.yml config --quiet

      - name: Run frontend typecheck and unit tests
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          CI=true npm run test:run

      - name: Build source self-host stack
        run: docker compose build backend mcp-sandbox frontend

      - name: Start real self-host stack
        run: |
          docker compose up -d postgres backend mcp-sandbox frontend
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:1956/health >/dev/null \
              && curl -fsS http://127.0.0.1:3456/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:3457/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres backend mcp-sandbox frontend
          exit 1

      - name: Run no-GCP self-host smoke
        run: EXPECT_LOCAL_MODE=false bash scripts/smoke-selfhost.sh

      - name: Verify migration journal was created
        run: |
          docker compose exec -T postgres psql \
            -U "${POSTGRES_USER:-aip}" -d "${POSTGRES_DB:-aip}" \
            -Atc "SELECT version FROM platform_schema_migrations ORDER BY version" \
            | grep -Fx '001_postgres_documents.sql'

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs postgres backend mcp-sandbox frontend

      - name: Stop release gate stack
        if: always()
        run: docker compose down -v --remove-orphans

  images:
    name: Build ${{ matrix.name }} image
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ai-protocol-platform-backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            image: ai-protocol-platform-frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - name: mcp-sandbox
            image: ai-protocol-platform-mcp-sandbox
            context: ./infrastructure/mcp-sandbox
            dockerfile: ./infrastructure/mcp-sandbox/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build or publish image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SKIP_QUALITY_CHECKS=true
            NEXT_PUBLIC_LOCAL_MODE=0
            NEXT_PUBLIC_ENABLE_SKILL_STUDIO=true
            NEXT_PUBLIC_AUTH_MODE=__aip_auth_mode_runtime__
            NEXT_PUBLIC_MCP_SANDBOX_URL=https://mcp-sandbox.runtime.invalid
            NEXT_PUBLIC_BRAND_APP_NAME=AI Protocol Platform
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Verify frontend release image accepts runtime public configuration
        if: github.event_name == 'pull_request' && matrix.name == 'frontend'
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY_OWNER}/${{ matrix.image }}:sha-${GITHUB_SHA}"
          docker run --rm \
            -e MCP_SANDBOX_PUBLIC_URL=https://mcp.release-ci.example \
            -e AUTH_BACKEND=oidc-runtime-ci-marker \
            "$IMAGE" \
            sh -c 'grep -RIl "https://mcp.release-ci.example" /app/.next >/dev/null \
              && ! grep -RIl "https://mcp-sandbox.runtime.invalid" /app/.next >/dev/null \
              && grep -RIl "oidc-runtime-ci-marker" /app/.next >/dev/null \
              && ! grep -RIl "__aip_auth_mode_runtime__" /app/.next >/dev/null'

      - name: Scan image for HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:sha-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"

  public-pull:
    name: Verify anonymous GHCR pulls
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Pull exact release tag without credentials
        shell: bash
        run: |
          set -euo pipefail
          anonymous_config="$(mktemp -d)"
          for image in \
            ai-protocol-platform-backend \
            ai-protocol-platform-frontend \
            ai-protocol-platform-mcp-sandbox; do
            DOCKER_CONFIG="$anonymous_config" docker pull \
              "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${image}:${GITHUB_REF_NAME}"
          done

  no-clone-cold-start:
    name: Verify no-clone release cold start
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images, public-pull]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download only tagged deployment assets
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "RELEASE_WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          raw_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"
          curl -fsSL "${raw_base}/docker-compose.release.yml" -o "${workdir}/docker-compose.release.yml"
          curl -fsSL "${raw_base}/.env.selfhost.example" -o "${workdir}/.env"

      - name: Pin exact release and configure isolated self-host
        shell: bash
        run: |
          set -euo pipefail
          cd "${RELEASE_WORKDIR}"
          sed -i "s/^APP_VERSION=.*/APP_VERSION=${GITHUB_REF_NAME}/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=release-cold-start-db-password/" .env
          sed -i "s#^DATABASE_URL=.*#DATABASE_URL=postgresql://aip:release-cold-start-db-password@postgres:5432/aip#" .env
          sed -i "s/^JWT_SIGNING_KEY=.*/JWT_SIGNING_KEY=release-cold-start-signing-key-at-least-32-bytes/" .env
          sed -i "s/^SELFHOST_ADMIN_EMAIL=.*/SELFHOST_ADMIN_EMAIL=admin@example.com/" .env
          sed -i "s/^SELFHOST_ADMIN_PASSWORD=.*/SELFHOST_ADMIN_PASSWORD=release-cold-start-admin-password/" .env
          sed -i "s/^PLATFORM_DEFAULT_MODEL=.*/PLATFORM_DEFAULT_MODEL=gpt-5-6-terra/" .env
          sed -i "s/^OPENAI_API_KEY=.*/OPENAI_API_KEY=release-cold-start-placeholder/" .env
          sed -i "s#^OPENAI_API_BASE=.*#OPENAI_API_BASE=http://model-gateway.invalid/v1#" .env
          sed -i "s/^SKIP_QUALITY_CHECKS=.*/SKIP_QUALITY_CHECKS=true/" .env
          docker compose -f docker-compose.release.yml config --quiet

      - name: Pull and start exact release without GitHub credentials
        shell: bash
        run: |
          set -euo pipefail
          cd "${RELEASE_WORKDIR}"
          anonymous_config="$(mktemp -d)"
          echo "ANONYMOUS_DOCKER_CONFIG=${anonymous_config}" >> "${GITHUB_ENV}"
          DOCKER_CONFIG="${anonymous_config}" docker compose -f docker-compose.release.yml pull
          DOCKER_CONFIG="${anonymous_config}" docker compose -f docker-compose.release.yml up -d

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:1956/health >/dev/null \
              && curl -fsS http://127.0.0.1:3456/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:3457/sandbox.html >/dev/null; then
              break
            fi
            if [[ "${i}" == "90" ]]; then
              DOCKER_CONFIG="${anonymous_config}" docker compose -f docker-compose.release.yml logs
              exit 1
            fi
            sleep 2
          done

          curl -fsS \
            -H 'content-type: application/json' \
            -d '{"email":"admin@example.com","password":"release-cold-start-admin-password"}' \
            http://127.0.0.1:1956/api/auth/login \
            | grep -q '"access_token"'

      - name: Show release logs on failure
        if: failure()
        shell: bash
        run: |
          cd "${RELEASE_WORKDIR}"
          DOCKER_CONFIG="${ANONYMOUS_DOCKER_CONFIG}" docker compose -f docker-compose.release.yml logs

      - name: Stop isolated release stack
        if: always()
        shell: bash
        run: |
          if [[ -n "${RELEASE_WORKDIR:-}" && -d "${RELEASE_WORKDIR}" ]]; then
            cd "${RELEASE_WORKDIR}"
            DOCKER_CONFIG="${ANONYMOUS_DOCKER_CONFIG:-${DOCKER_CONFIG:-}}" docker compose -f docker-compose.release.yml down -v --remove-orphans || true
          fi

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [images, public-pull, no-clone-cold-start]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage pinned deployment assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp docker-compose.release.yml release-assets/docker-compose.release.yml
          sed "s/^APP_VERSION=.*/APP_VERSION=${GITHUB_REF_NAME}/" \
            .env.selfhost.example > release-assets/.env.selfhost.example
          grep -Fx "APP_VERSION=${GITHUB_REF_NAME}" release-assets/.env.selfhost.example

      - name: Publish generated release notes and deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --title "AI Protocol Platform ${GITHUB_REF_NAME}" \
            release-assets/docker-compose.release.yml \
            release-assets/.env.selfhost.example
