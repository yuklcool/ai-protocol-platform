name: MCP admin gate

on:
  pull_request:
    paths:
      - backend/admin/**
      - backend/tools/mcp/**
      - backend/protocols/mcp_proxy.py
      - backend/tests/api_tests/test_admin_mcp_servers.py
      - backend/tests/api_tests/test_admin_mcp_diagnostics.py
      - backend/tests/api_tests/test_admin_cross_tenant_matrix.py
      - backend/tests/api_tests/test_mcp_enabled_state.py
      - backend/tests/api_tests/test_mcp_proxy.py
      - backend/tests/unit/test_mcp_diagnostics.py
      - backend/tests/unit/test_mcp_tenant_isolation.py
      - frontend/src/app/admin/mcp-servers/**
      - frontend/src/app/admin/page.tsx
      - docker-compose.yml
      - infrastructure/mcp-ext-apps-map/**
      - docs/selfhost-mcp-server.md
      - .github/workflows/mcp-admin-gate.yml
  push:
    branches: [main]
    paths:
      - backend/admin/**
      - backend/tools/mcp/**
      - backend/protocols/mcp_proxy.py
      - backend/tests/api_tests/test_admin_mcp_servers.py
      - backend/tests/api_tests/test_admin_mcp_diagnostics.py
      - backend/tests/api_tests/test_admin_cross_tenant_matrix.py
      - backend/tests/api_tests/test_mcp_enabled_state.py
      - backend/tests/api_tests/test_mcp_proxy.py
      - backend/tests/unit/test_mcp_diagnostics.py
      - backend/tests/unit/test_mcp_tenant_isolation.py
      - frontend/src/app/admin/mcp-servers/**
      - frontend/src/app/admin/page.tsx
      - docker-compose.yml
      - infrastructure/mcp-ext-apps-map/**
      - docs/selfhost-mcp-server.md
      - .github/workflows/mcp-admin-gate.yml

jobs:
  mcp-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      PLATFORM_OWNER_EMAIL: platform@ci.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend
        run: docker compose build backend

      - name: Run MCP admin and scope regression tests
        run: |
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=memory \
            -e SESSION_BACKEND=memory \
            -e MEMORY_BACKEND=memory \
            -e PLATFORM_OWNER_EMAIL=platform@ci.local \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend uv run pytest -q \
              tests/api_tests/test_admin_mcp_servers.py \
              tests/api_tests/test_admin_mcp_diagnostics.py \
              tests/api_tests/test_admin_cross_tenant_matrix.py \
              tests/api_tests/test_mcp_enabled_state.py \
              tests/api_tests/test_mcp_proxy.py \
              tests/unit/test_mcp_diagnostics.py \
              tests/unit/test_mcp_tenant_isolation.py

  mcp-admin-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck MCP admin surface
        run: npm run typecheck
      - name: Enforce authenticated proxy fetches
        run: npm run check:auth-fetch
