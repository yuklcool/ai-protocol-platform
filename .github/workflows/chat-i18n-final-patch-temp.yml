name: Temporary final Chat i18n patch

on:
  push:
    branches:
      - feat/i18n-chat-presentation
    paths:
      - .github/workflows/chat-i18n-final-patch-temp.yml
      - scripts/i18n_chat_final_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/i18n-chat-presentation
          fetch-depth: 0

      - name: Apply deterministic final Chat patch
        run: python scripts/i18n_chat_final_patch.py

      - name: Verify patch formatting
        run: git diff --check

      - name: Commit formal Chat localization changes
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/src/lib/i18n/chat.ts frontend/src/components/chat; then
            echo "Final Chat presentation patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/lib/i18n/chat.ts frontend/src/components/chat
          git commit -m "feat(i18n): complete Chat presentation localization"
          git push origin HEAD:feat/i18n-chat-presentation
