name: Build and release images

on:
  push:
    branches: [main]
    paths:
      - .github/release-candidate.json
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  candidate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.candidate.outputs.enabled }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read and validate candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "Release preparation must run on main." >&2; exit 1; }
          file=".github/release-candidate.json"
          enabled="$(jq -r '.enabled' "$file")"
          version="$(jq -r '.version' "$file")"

          [[ "$enabled" == "true" ]] || { echo "Release candidate is disabled." >&2; exit 1; }
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "version must be stable SemVer vX.Y.Z" >&2
            exit 1
          }

          if git ls-remote --tags origin "refs/tags/$version" | grep -q .; then
            echo "Release tag already exists: $version" >&2
            exit 1
          fi

          {
            echo "enabled=$enabled"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  tag-and-dispatch-release:
    name: Tag source commit and start release
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create exact release tag
        env:
          VERSION: ${{ needs.candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "Release tag already exists: $VERSION" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "AI Protocol Platform $VERSION"
          git push origin "$VERSION"

      - name: Dispatch image build on the source tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.candidate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/release-images.yml/dispatches"             -f "ref=$VERSION"
          echo "Release workflow dispatched for $VERSION"
