name: Lighting Skill adapter
on:
  pull_request:
    paths: ['skills/lighting-*/**', 'infrastructure/lighting-skills/**', 'backend/lighting/**', 'backend/adk/**', 'backend/tests/fixtures/lighting*', 'backend/tests/unit/test_lighting*', '.github/workflows/lighting-skill-adapter.yml']
  push:
    branches: [main]
    paths: ['skills/lighting-*/**', 'infrastructure/lighting-skills/**', 'backend/lighting/**', 'backend/adk/**', 'backend/tests/fixtures/lighting*', 'backend/tests/unit/test_lighting*', '.github/workflows/lighting-skill-adapter.yml']
  workflow_dispatch:
    inputs:
      verify_server:
        description: Run acceptance against the explicitly prepared production host
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  lighting-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lighting
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: lighting_ci
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --project backend --dev
      - name: Dynamic SQL results, six scene contracts and authorization
        working-directory: backend
        env:
          LIGHTING_TEST_DATABASE_URL: postgres://lighting:disposable-ci-password@localhost:5432/lighting_ci
          GOOGLE_CLOUD_PROJECT: test-project
          AUTH_BACKEND: local-jwt
          JWT_SIGNING_KEY: ci-test-only-signing-key-at-least-32-characters
          DATA_BACKEND: memory
          SESSION_BACKEND: memory
          MEMORY_BACKEND: memory
          OBJECT_STORAGE_BACKEND: local
          ARTIFACT_BACKEND: memory
          SELF_HOSTED_MODE: '1'
          GOOGLE_GENAI_USE_VERTEXAI: 'false'
          TRACE_EXPORT_ENABLED: '0'
          CLOUD_LOGGING_ENABLED: '0'
        run: uv run pytest tests/unit/test_lighting_results.py tests/unit/test_lighting_mcp_account_scope.py ../infrastructure/lighting-skills/test_dynamic_sql.py -q --tb=short
  deployment-acceptance:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.verify_server
    needs: lighting-skills
    runs-on: [self-hosted, lighting-a2ui-129-20261026]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real Agent, safety Skill, dynamic SQL and A2UI; no raw data in logs
        run: python3 infrastructure/lighting-skills/verify_live.py
