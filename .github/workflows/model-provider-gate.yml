jobs:
  model-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      PLATFORM_OWNER_EMAIL: platform@ci.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend
        run: docker compose build backend
      - name: Run model-provider, user-ownership and admin-role tests
        run: |
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=memory \
            -e SESSION_BACKEND=memory \
            -e MEMORY_BACKEND=memory \
            -e MODEL_REGISTRY_BACKEND=database \
            -e AIP_TEST_ISOLATED_NETWORK=1 \
            -e PLATFORM_OWNER_EMAIL=platform@ci.local \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend uv run pytest -q \
              tests/api_tests/test_root_console_completion.py \
              tests/api_tests/test_admin_model_providers.py \
              tests/api_tests/test_admin_model_probe.py \
              tests/api_tests/test_model_setup_flow.py \
              tests/api_tests/test_sessions_route.py \
              tests/api_tests/test_sessions_recent.py \
              tests/unit/test_platform_config.py \
              tests/api_tests/test_admin_model_registry_settings.py \
              tests/unit/test_model_provider_registry.py \
              tests/unit/test_effective_models.py \
              tests/unit/test_runtime_models.py \
              tests/unit/test_model_runtime_routing.py

  model-provider-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_AUTH_BACKEND: local-jwt
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify provider management and workspace continuity
        env:
          CI: "true"
        run: |
          npm run test:run -- \
            src/app/admin/model-providers/__tests__/ModelProvidersPage.test.tsx \
            src/app/admin/__tests__/AdminHub.test.tsx \
            src/components/admin/__tests__/AgentReadiness.test.tsx \
            src/components/workspace/__tests__/ResultsPage.test.tsx \
            src/components/workspace/__tests__/WorkspacePages.test.tsx \
            src/components/navigation/__tests__/ConsoleSidebar.test.tsx \
            src/components/navigation/__tests__/RootAgentBar.test.tsx \
            src/components/navigation/__tests__/UserMenu.test.tsx \
            src/components/home/__tests__/HomeGate.test.tsx \
            src/hooks/__tests__/useLandingTarget.test.tsx \
            src/hooks/__tests__/useSkillSessions.test.ts \
            src/hooks/__tests__/useUserSkills.test.tsx \
            src/components/agent/__tests__/PersonalProfileEditor.test.tsx \
            src/components/studio/__tests__/StudioPage.test.tsx \
            src/components/skills/__tests__/SkillsPage.test.tsx \
            src/components/chat/__tests__/ChatShell.composer.test.tsx \
            src/components/chat/__tests__/ChatSidebar.test.tsx \
            src/components/chat/__tests__/SkillSessionPanel.test.tsx \
            src/components/doc-browser/__tests__/DocListFolder.test.tsx \
            src/components/doc-browser/__tests__/DocListItem.test.tsx \
            src/components/doc-browser/__tests__/DocTabsBar.test.tsx \
            src/components/chat/__tests__/ChatShell.workspaceHome.test.tsx \
            src/components/chat/__tests__/ChatShell.closeArtefactTab.test.tsx \
            src/components/chat/__tests__/ChatShell.pricesArtefact.test.tsx \
            src/lib/__tests__/sessionHref.test.ts
      - name: Build frontend for local JWT
        run: npm run build

  model-provider-studio-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUTH_BACKEND: local-jwt
      JWT_SIGNING_KEY: model-studio-ci-signing-key-at-least-32-bytes-long
      JWT_ISSUER: ai-protocol-platform-model-studio-ci
      JWT_AUDIENCE: ai-protocol-platform-model-studio-ci
      JWT_EXPIRE_MINUTES: "60"
      SELFHOST_ADMIN_EMAIL: admin@example.com
      SELFHOST_ADMIN_PASSWORD: ci-model-studio-admin-password
      PLATFORM_DEFAULT_MODEL: lite
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_API_BASE: http://model-gateway.invalid/v1
      SKIP_QUALITY_CHECKS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser acceptance syntax
        run: |
          node --check frontend/e2e/model-provider-studio-live.spec.js
          node --check frontend/e2e/root-console-live.spec.js
          node --check frontend/e2e/model-setup-live.spec.js
          node --check frontend/e2e/chat-files-live.spec.js
          node --check frontend/e2e/ui-responsive-live.spec.js
          node --check frontend/e2e/session-search-live.spec.js
          node --check frontend/e2e/in-chat-execution.spec.js
          node --check frontend/e2e/chat-layout-live.spec.js
          node --check frontend/e2e/task-plan-live.spec.js
          node --check frontend/e2e/v3-workspace-live.spec.js

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build model-provider Studio stack
        run: docker compose build backend mcp-sandbox frontend

      - name: Start PostgreSQL backend frontend and sandbox
        run: |
          docker compose up -d postgres backend mcp-sandbox frontend
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:1956/health >/dev/null \
              && curl -fsS http://127.0.0.1:3456/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:3457/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres backend mcp-sandbox frontend
          exit 1

      - name: Start isolated HTTP protocol test provider
        run: |
          docker run -d --name model-setup-probe --network ai-protocol-platform \
            -p 127.0.0.1:7956:8080 -e PROBE_API_KEY="$OPENAI_API_KEY" \
            -v "$PWD/backend/tests/fixtures/model_setup_probe.py:/probe.py:ro" \
            python:3.12-alpine python /probe.py
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:7956/evidence >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1

      - name: Seed isolated session search metadata
        run: |
          docker compose run --rm --no-deps \
            -v "$PWD/backend/tests:/app/tests:ro" \
            -e SELFHOST_ADMIN_EMAIL -e SELFHOST_ADMIN_PASSWORD \
            -e SESSION_SEARCH_E2E_RUN_ID=search-${{ github.run_id }} \
            backend uv run python -m tests.support.seed_session_search

      - name: Install Chromium acceptance runner
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Root model, Skill content and console browser acceptance
        working-directory: frontend
        env:
          UI_REVIEW_PREVIEW: "1"
          SESSION_SEARCH_E2E_RUN_ID: search-${{ github.run_id }}
          MODEL_STUDIO_E2E_RUN_ID: studio-${{ github.run_id }}
          MODEL_STUDIO_FRONTEND_URL: http://localhost:3456
          MODEL_STUDIO_BACKEND_URL: http://127.0.0.1:1956
        run: npx playwright test e2e/model-provider-studio-live.spec.js e2e/root-console-live.spec.js e2e/model-setup-live.spec.js e2e/chat-files-live.spec.js e2e/ui-responsive-live.spec.js e2e/session-search-live.spec.js e2e/in-chat-execution.spec.js e2e/task-plan-live.spec.js e2e/v3-workspace-live.spec.js e2e/chat-layout-live.spec.js --reporter=line --workers=1

      - name: Preserve model Root and Skill browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-root-skill-${{ github.run_id }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs postgres backend mcp-sandbox frontend

      - name: Stop services and remove acceptance volumes
        if: always()
        run: |
          docker rm -f model-setup-probe || true
          docker compose down -v --remove-orphans
