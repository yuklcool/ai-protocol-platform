name: Model provider gate

on:
  pull_request:
    paths:
      - frontend/src/app/admin/model-providers/**
      - frontend/src/app/skills/studio/**
      - frontend/src/components/studio/**
      - frontend/src/lib/i18n/skillStudio.ts
      - frontend/e2e/model-provider-studio-live.spec.js
      - docker-compose.yml
      - frontend/src/app/admin/page.tsx
      - frontend/src/app/admin/__tests__/AdminHub.test.tsx
      - frontend/package*.json
      - backend/admin/model_providers_routes.py
      - backend/admin/model_probe_routes.py
      - backend/admin/model_registry_settings_routes.py
      - backend/admin/tenant_model_policy_routes.py
      - backend/admin/routes.py
      - backend/adk/agent.py
      - backend/config/model_provider_registry.py
      - backend/config/effective_models.py
      - backend/config/runtime_models.py
      - backend/config/tenant_models.py
      - backend/protocols/models_route.py
      - backend/tests/api_tests/test_admin_model_providers.py
      - backend/tests/api_tests/test_admin_model_probe.py
      - backend/tests/api_tests/test_admin_model_registry_settings.py
      - backend/tests/api_tests/test_admin_tenant_model_policy.py
      - backend/tests/api_tests/test_tenant_models_route.py
      - backend/tests/api_tests/test_admin_cross_tenant_matrix.py
      - backend/tests/unit/test_model_provider_registry.py
      - backend/tests/unit/test_effective_models.py
      - backend/tests/unit/test_runtime_models.py
      - backend/tests/unit/test_tenant_models.py
      - backend/tests/unit/test_model_runtime_routing.py
      - .github/workflows/model-provider-gate.yml
  push:
    branches: [main]
    paths:
      - frontend/src/app/admin/model-providers/**
      - frontend/src/app/skills/studio/**
      - frontend/src/components/studio/**
      - frontend/src/lib/i18n/skillStudio.ts
      - frontend/e2e/model-provider-studio-live.spec.js
      - docker-compose.yml
      - frontend/src/app/admin/page.tsx
      - frontend/src/app/admin/__tests__/AdminHub.test.tsx
      - frontend/package*.json
      - backend/admin/model_providers_routes.py
      - backend/admin/model_probe_routes.py
      - backend/admin/model_registry_settings_routes.py
      - backend/admin/tenant_model_policy_routes.py
      - backend/admin/routes.py
      - backend/adk/agent.py
      - backend/config/model_provider_registry.py
      - backend/config/effective_models.py
      - backend/config/runtime_models.py
      - backend/config/tenant_models.py
      - backend/protocols/models_route.py
      - backend/tests/api_tests/test_admin_model_providers.py
      - backend/tests/api_tests/test_admin_model_probe.py
      - backend/tests/api_tests/test_admin_model_registry_settings.py
      - backend/tests/api_tests/test_admin_tenant_model_policy.py
      - backend/tests/api_tests/test_tenant_models_route.py
      - backend/tests/api_tests/test_admin_cross_tenant_matrix.py
      - backend/tests/unit/test_model_provider_registry.py
      - backend/tests/unit/test_effective_models.py
      - backend/tests/unit/test_runtime_models.py
      - backend/tests/unit/test_tenant_models.py
      - backend/tests/unit/test_model_runtime_routing.py
      - .github/workflows/model-provider-gate.yml

jobs:
  model-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      PLATFORM_OWNER_EMAIL: platform@ci.local

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build backend
        run: docker compose build backend
      - name: Run model-provider, tenant-policy and admin-scope tests
        run: |
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=memory \
            -e SESSION_BACKEND=memory \
            -e MEMORY_BACKEND=memory \
            -e PLATFORM_OWNER_EMAIL=platform@ci.local \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend uv run pytest -q \
              tests/api_tests/test_admin_model_providers.py \
              tests/api_tests/test_admin_model_probe.py \
              tests/api_tests/test_admin_model_registry_settings.py \
              tests/api_tests/test_admin_tenant_model_policy.py \
              tests/api_tests/test_tenant_models_route.py \
              tests/api_tests/test_admin_cross_tenant_matrix.py \
              tests/unit/test_model_provider_registry.py \
              tests/unit/test_effective_models.py \
              tests/unit/test_runtime_models.py \
              tests/unit/test_tenant_models.py \
              tests/unit/test_model_runtime_routing.py

  model-provider-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_AUTH_BACKEND: local-jwt
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Verify provider management interactions
        run: CI=true npm run test:run -- src/app/admin/model-providers/__tests__/ModelProvidersPage.test.tsx src/app/admin/__tests__/AdminHub.test.tsx
      - name: Build frontend for local JWT
        run: npm run build

  model-provider-studio-live:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      AUTH_BACKEND: local-jwt
      JWT_SIGNING_KEY: model-studio-ci-signing-key-at-least-32-bytes-long
      JWT_ISSUER: ai-protocol-platform-model-studio-ci
      JWT_AUDIENCE: ai-protocol-platform-model-studio-ci
      JWT_EXPIRE_MINUTES: "60"
      SELFHOST_ADMIN_EMAIL: admin@example.com
      SELFHOST_ADMIN_PASSWORD: ci-model-studio-admin-password
      PLATFORM_DEFAULT_MODEL: lite
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_API_BASE: http://model-gateway.invalid/v1
      SKIP_QUALITY_CHECKS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser acceptance syntax
        run: node --check frontend/e2e/model-provider-studio-live.spec.js

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build model-provider Studio stack
        run: docker compose build backend mcp-sandbox frontend

      - name: Start PostgreSQL backend frontend and sandbox
        run: |
          docker compose up -d postgres backend mcp-sandbox frontend
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:1956/health >/dev/null \
              && curl -fsS http://127.0.0.1:3456/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:3457/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres backend mcp-sandbox frontend
          exit 1

      - name: Install Chromium acceptance runner
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run dynamic model Skill Studio browser acceptance
        working-directory: frontend
        env:
          MODEL_STUDIO_E2E_RUN_ID: studio-${{ github.run_id }}
          MODEL_STUDIO_FRONTEND_URL: http://localhost:3456
          MODEL_STUDIO_BACKEND_URL: http://127.0.0.1:1956
        run: npx playwright test e2e/model-provider-studio-live.spec.js --reporter=line --workers=1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs postgres backend mcp-sandbox frontend

      - name: Stop services and remove acceptance volumes
        if: always()
        run: docker compose down -v --remove-orphans

