name: Protocol operation acceptance

on:
  push:
    branches: [main, fix/protocol-operation-completion, refactor/simplify-platform-modules, feat/root-console-completion]
    paths:
      - .github/release-candidate.json
      - infrastructure/mcp-sandbox/**
      - backend/**
      - frontend/**
      - docker-compose.yml
      - .github/workflows/real-provider-agent-mcp-acceptance.yml
      - .github/workflows/protocol-operation-acceptance.yml
      - .github/workflows/release-images.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-operation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-real-provider:
    uses: ./.github/workflows/real-provider-agent-mcp-acceptance.yml
    with:
      # Same explicit gateway/model used by this repository's previous real
      # acceptance. Repository variables can replace them for another deploy.
      provider_base_url: ${{ vars.REAL_PROVIDER_BASE_URL || 'https://sub2api.yukl.qzz.io/v1' }}
      model_api_name: ${{ vars.REAL_PROVIDER_MODEL || 'gpt-6-luna' }}
      supports_reasoning: false
    secrets:
      REAL_PROVIDER_API_KEY: ${{ secrets.REAL_PROVIDER_API_KEY }}
