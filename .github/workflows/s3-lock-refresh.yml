name: Temporary S3 lock refresh

on:
  push:
    branches: [feat/s3-object-storage]
    paths:
      - backend/pyproject.toml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Refresh uv lock
        run: uv lock
      - name: Commit lockfile when changed
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/uv.lock; then
            echo "backend/uv.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "chore: refresh uv lock for S3 storage"
          git push
