name: Temporary Chat i18n literal audit

on:
  push:
    branches:
      - feat/i18n-chat-presentation
    paths:
      - .github/workflows/chat-i18n-audit-temp.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print remaining localization contexts
        shell: bash
        run: |
          echo '=== ChatMessageList 390-480 ==='
          sed -n '390,480p' frontend/src/components/chat/ChatMessageList.tsx
          echo '=== ActivityPanel 300-410 ==='
          sed -n '300,410p' frontend/src/components/chat/ActivityPanel.tsx
          echo '=== MessageBubble 285-330 ==='
          sed -n '285,330p' frontend/src/components/chat/MessageBubble.tsx
          echo '=== ReadAloudButton 365-385 ==='
          sed -n '365,385p' frontend/src/components/chat/ReadAloudButton.tsx
          echo '=== CodeBlock 75-135 ==='
          sed -n '75,135p' frontend/src/components/chat/CodeBlock.tsx
          echo '=== WorkbenchResizeHandle 145-170 ==='
          sed -n '145,170p' frontend/src/components/chat/WorkbenchResizeHandle.tsx
