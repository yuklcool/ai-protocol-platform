name: Temporary refresh backend security lock

on:
  push:
    branches:
      - fix/release-mcp-sandbox-runtime
    paths:
      - backend/pyproject.toml
      - .github/workflows/refresh-security-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/release-mcp-sandbox-runtime

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Resolve backend lock
        working-directory: backend
        run: |
          set -euo pipefail
          uv lock
          uv lock --check

      - name: Commit refreshed lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- backend/uv.lock; then
            echo "uv.lock already satisfies the security floors"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/uv.lock
          git commit -m "chore(security): refresh backend dependency lock"
          git push origin HEAD:fix/release-mcp-sandbox-runtime
