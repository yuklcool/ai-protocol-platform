      - backend/db/chat_sessions.py
      - backend/db/models/document.py
      - backend/db/folders.py
      - backend/observability/tenant_context.py
      - backend/protocols/session_bootstrap_routes.py
      - backend/skills/skill_processor.py
      - backend/tools/documents/routes.py
