      - backend/tests/unit/test_document_tenant_isolation.py
      - backend/tests/unit/test_tenant_models.py
      - backend/tests/unit/test_runtime_models.py
      - backend/tests/storage_tests/test_artifact_backend.py
      - backend/tests/persistence_tests/test_tenant_repository.py
      - backend/tests/api_tests/test_admin_tenants.py
      - backend/tests/api_tests/test_admin_cross_tenant_matrix.py
      - .github/workflows/tenant-isolation.yml

jobs:
  tenant-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SIGNING_KEY: tenant-isolation-ci-signing-key-at-least-32-bytes
      JWT_ISSUER: tenant-isolation-ci
      JWT_AUDIENCE: tenant-isolation-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend
        run: docker compose build backend

      - name: Verify tenant identity admin model session document artifact boundaries and fail-closed repository
        run: |
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=memory \
            -e SESSION_BACKEND=memory \
            -e MEMORY_BACKEND=memory \
            -e ARTIFACT_BACKEND=local \
            -e OBJECT_STORAGE_BACKEND=local \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend uv run pytest -q \
            tests/unit/test_admin_audit.py \
            tests/api_tests/test_admin_audit_read.py \
            tests/api_tests/test_sessions_route.py \
            tests/api_tests/test_stream_skill.py \
            tests/api_tests/test_admin_tenant_model_policy.py \
            tests/api_tests/test_tenant_models_route.py \
            tests/unit/test_tenant_models.py \
            tests/unit/test_runtime_models.py \
            tests/unit/test_mcp_tenant_isolation.py \
            tests/unit/test_mcp_seed_scope.py \
            tests/tool_tests/test_mcp_registry.py \
            tests/tool_tests/test_mcp_registry_cache.py \
            tests/tool_tests/test_mcp_registry_ui_capability.py \
            tests/persistence_tests/test_mcp_registry_repository.py \
            tests/api_tests/test_mcp_proxy.py \
            tests/api_tests/test_mcp_proxy_artefact_review.py \
            tests/unit/test_tenant_identity.py \
            tests/unit/test_tenant_migration.py \
            tests/unit/test_access_context.py \
            tests/unit/test_admin_scope.py \
            tests/unit/test_session_tenant_isolation.py \
            tests/unit/test_document_tenant_isolation.py \
            tests/storage_tests/test_artifact_backend.py \
            tests/persistence_tests/test_tenant_repository.py \
            tests/api_tests/test_admin_tenants.py \
            tests/api_tests/test_admin_cross_tenant_matrix.py
