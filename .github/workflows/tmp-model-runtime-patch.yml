name: Temporary model runtime patch

on:
  push:
    branches:
      - feat/model-provider-runtime-routing
    paths:
      - .github/workflows/tmp-model-runtime-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/tmp_patch_model_runtime.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/adk/agent.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(models): route dynamic providers at agent runtime"
          git push origin HEAD:feat/model-provider-runtime-routing
