name: Self-host baseline

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - .env.selfhost.example
      - SELFHOST.md
      - frontend/Dockerfile
      - frontend/src/__tests__/next-public-env-declared.test.ts
      - backend/Dockerfile
      - backend/services.py
      - backend/adk/agent.py
      - backend/adk/session.py
      - backend/adk/postgres_memory.py
      - backend/auth/permissions.py
      - backend/config/models.py
      - backend/config/models.yaml
      - backend/db/chat_sessions.py
      - backend/db/clients.py
      - backend/db/persistence.py
      - backend/db/repository.py
      - backend/db/repositories/**
      - backend/db/migrations/**
      - backend/scripts/seed_selfhost_persistence.py
      - backend/skills/skill_config.py
      - backend/admin/audit.py
      - backend/admin/clients.py
      - backend/admin/tool_permissions_routes.py
      - backend/tests/api_tests/test_admin_clients.py
      - backend/tests/api_tests/test_admin_tool_permissions.py
      - backend/tests/api_tests/test_sessions_recent.py
      - backend/tests/api_tests/test_sessions_route.py
      - backend/tests/integration/test_postgres_adk_session_memory.py
      - backend/tests/integration/test_postgres_a2ui_resume.py
      - backend/tests/model_tests/test_openai_compatible_routing.py
      - backend/tests/persistence_tests/**
      - backend/tests/unit/test_admin_audit.py
      - backend/tests/unit/test_clients.py
      - backend/tests/unit/test_permissions.py
      - backend/tests/unit/test_postgres_memory.py
      - backend/tests/unit/test_postgres_session_memory_factories.py
      - backend/tests/unit/test_session_factories.py
      - backend/tests/unit/test_skill_config.py
      - infrastructure/mcp-sandbox/**
      - scripts/smoke-selfhost.sh
      - .github/workflows/selfhost-baseline.yml
  pull_request:
    paths:
      - docker-compose.yml
      - .env.selfhost.example
      - SELFHOST.md
      - frontend/Dockerfile
      - frontend/src/__tests__/next-public-env-declared.test.ts
      - backend/Dockerfile
      - backend/services.py
      - backend/adk/agent.py
      - backend/adk/session.py
      - backend/adk/postgres_memory.py
      - backend/auth/permissions.py
      - backend/config/models.py
      - backend/config/models.yaml
      - backend/db/chat_sessions.py
      - backend/db/clients.py
      - backend/db/persistence.py
      - backend/db/repository.py
      - backend/db/repositories/**
      - backend/db/migrations/**
      - backend/scripts/seed_selfhost_persistence.py
      - backend/skills/skill_config.py
      - backend/admin/audit.py
      - backend/admin/clients.py
      - backend/admin/tool_permissions_routes.py
      - backend/tests/api_tests/test_admin_clients.py
      - backend/tests/api_tests/test_admin_tool_permissions.py
      - backend/tests/api_tests/test_sessions_recent.py
      - backend/tests/api_tests/test_sessions_route.py
      - backend/tests/integration/test_postgres_adk_session_memory.py
      - backend/tests/integration/test_postgres_a2ui_resume.py
      - backend/tests/model_tests/test_openai_compatible_routing.py
      - backend/tests/persistence_tests/**
      - backend/tests/unit/test_admin_audit.py
      - backend/tests/unit/test_clients.py
      - backend/tests/unit/test_permissions.py
      - backend/tests/unit/test_postgres_memory.py
      - backend/tests/unit/test_postgres_session_memory_factories.py
      - backend/tests/unit/test_session_factories.py
      - backend/tests/unit/test_skill_config.py
      - infrastructure/mcp-sandbox/**
      - scripts/smoke-selfhost.sh
      - .github/workflows/selfhost-baseline.yml

jobs:
  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      SKIP_QUALITY_CHECKS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Verify frontend public env declarations
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:run -- src/__tests__/next-public-env-declared.test.ts

      - name: Build backend
        run: docker compose build backend

      - name: Test OpenAI-compatible provider routing
        run: |
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=memory \
            -e SESSION_BACKEND=memory \
            -e MEMORY_BACKEND=memory \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend uv run pytest -q tests/model_tests/test_openai_compatible_routing.py

      - name: Test persistence repository contract
        run: |
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=memory \
            -e SESSION_BACKEND=memory \
            -e MEMORY_BACKEND=memory \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend uv run pytest -q tests/persistence_tests/test_repository_contract.py

      - name: Test PostgreSQL Session and Memory factories
        run: |
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=memory \
            -e SESSION_BACKEND=memory \
            -e MEMORY_BACKEND=memory \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend uv run pytest -q \
              tests/unit/test_postgres_session_memory_factories.py \
              tests/unit/test_postgres_memory.py

      - name: Test migrated persistence domains
        run: |
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=memory \
            -e SESSION_BACKEND=memory \
            -e MEMORY_BACKEND=memory \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend uv run pytest -q \
              tests/unit/test_admin_audit.py \
              tests/unit/test_clients.py \
              tests/unit/test_permissions.py \
              tests/unit/test_skill_config.py \
              tests/api_tests/test_admin_clients.py \
              tests/api_tests/test_admin_tool_permissions.py \
              tests/api_tests/test_sessions_recent.py \
              tests/api_tests/test_sessions_route.py
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=memory \
            -e SESSION_BACKEND=memory \
            -e MEMORY_BACKEND=memory \
            backend uv run python -c "from skills import skill_config; from admin import audit, clients as admin_clients, tool_permissions_routes; from auth import permissions; from db import chat_sessions, clients; from db.persistence import build_repository; assert build_repository('memory').healthcheck(); print('migrated persistence domains import OK')"

      - name: Verify PostgreSQL repository and fixture seed
        run: |
          docker compose up -d postgres
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=postgres \
            -e DATABASE_URL=postgresql://aip:aip-local-change-me@postgres:5432/aip \
            backend uv run python -c "from db.persistence import get_repository; r=get_repository(); assert r.healthcheck(); r.set_document('ci','probe',{'ok': True}); assert r.get_document('ci','probe')['ok'] is True; r.array_union_field('ci','probe','items',['a','b','a']); assert r.get_document('ci','probe')['items']==['a','b']; r.delete_document('ci','probe'); print('postgres repository OK')"
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=postgres \
            -e DATABASE_URL=postgresql://aip:aip-local-change-me@postgres:5432/aip \
            backend uv run python scripts/seed_selfhost_persistence.py
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=postgres \
            -e DATABASE_URL=postgresql://aip:aip-local-change-me@postgres:5432/aip \
            backend uv run python -c "from db.persistence import get_repository; r=get_repository(); assert r.query_documents('skills', limit=1), 'self-host seed did not create skills'; p=r.get_document('tool_permissions','*'); assert p and '*' in p.get('tools', []), 'self-host seed did not create wildcard permission'; print('postgres self-host seed OK')"

      - name: Verify ADK Session, Memory and A2UI resume survive PostgreSQL reconstruction
        run: |
          docker compose run --rm --no-deps \
            -e DATA_BACKEND=postgres \
            -e SESSION_BACKEND=postgres \
            -e MEMORY_BACKEND=postgres \
            -e DATABASE_URL=postgresql://aip:aip-local-change-me@postgres:5432/aip \
            -v "$PWD/backend/tests:/app/tests:ro" \
            backend uv run pytest -q \
              tests/integration/test_postgres_adk_session_memory.py \
              tests/integration/test_postgres_a2ui_resume.py

      - name: Build self-host images
        run: docker compose build --pull
