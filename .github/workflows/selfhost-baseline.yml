name: Self-host baseline

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - .env.selfhost.example
      - SELFHOST.md
      - frontend/Dockerfile
      - frontend/src/__tests__/next-public-env-declared.test.ts
      - backend/Dockerfile
      - backend/adk/agent.py
      - backend/config/models.py
      - backend/config/models.yaml
      - backend/tests/model_tests/test_openai_compatible_routing.py
      - infrastructure/mcp-sandbox/**
      - scripts/smoke-selfhost.sh
      - .github/workflows/selfhost-baseline.yml
  pull_request:
    paths:
      - docker-compose.yml
      - .env.selfhost.example
      - SELFHOST.md
      - frontend/Dockerfile
      - frontend/src/__tests__/next-public-env-declared.test.ts
      - backend/Dockerfile
      - backend/adk/agent.py
      - backend/config/models.py
      - backend/config/models.yaml
      - backend/tests/model_tests/test_openai_compatible_routing.py
      - infrastructure/mcp-sandbox/**
      - scripts/smoke-selfhost.sh
      - .github/workflows/selfhost-baseline.yml

jobs:
  compose-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Image builds and unit tests do not make a real LLM request.
      GEMINI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      SKIP_QUALITY_CHECKS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Verify frontend public env declarations
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run test:run -- src/__tests__/next-public-env-declared.test.ts

      - name: Test OpenAI-compatible provider routing
        run: |
          docker compose build backend
          docker compose run --rm --no-deps backend \
            uv run pytest -q tests/model_tests/test_openai_compatible_routing.py

      - name: Build self-host images
        run: docker compose build --pull
