name: I18n and branding gate

on:
  pull_request:
    paths:
      - frontend/src/lib/i18n.ts
      - frontend/src/lib/i18n/**
      - frontend/src/lib/branding.ts
      - frontend/src/contexts/I18nContext.tsx
      - frontend/src/components/LanguageSwitcher.tsx
      - frontend/src/components/BackendHealthBadge.tsx
      - frontend/src/components/LocalModeBanner.tsx
      - frontend/src/components/SignInButton.tsx
      - frontend/src/components/admin/**
      - frontend/src/components/studio/**
      - frontend/src/components/chat/**
      - frontend/src/components/home/**
      - frontend/src/components/landing/**
      - frontend/src/app/admin/**
      - frontend/src/app/skills/studio/**
      - frontend/src/app/layout.tsx
      - frontend/src/app/page.tsx
      - frontend/src/lib/__tests__/i18n.test.ts
      - frontend/src/lib/__tests__/*I18n.test.ts
      - frontend/Dockerfile
      - docker-compose.yml
      - .env.selfhost.example
      - .github/workflows/i18n-branding.yml
  push:
    branches: [main]
    paths:
      - frontend/src/lib/i18n.ts
      - frontend/src/lib/i18n/**
      - frontend/src/lib/branding.ts
      - frontend/src/contexts/I18nContext.tsx
      - frontend/src/components/LanguageSwitcher.tsx
      - frontend/src/components/BackendHealthBadge.tsx
      - frontend/src/components/LocalModeBanner.tsx
      - frontend/src/components/SignInButton.tsx
      - frontend/src/components/admin/**
      - frontend/src/components/studio/**
      - frontend/src/components/chat/**
      - frontend/src/components/home/**
      - frontend/src/components/landing/**
      - frontend/src/app/admin/**
      - frontend/src/app/skills/studio/**
      - frontend/src/app/layout.tsx
      - frontend/src/app/page.tsx
      - frontend/src/lib/__tests__/i18n.test.ts
      - frontend/src/lib/__tests__/*I18n.test.ts
      - frontend/Dockerfile
      - docker-compose.yml
      - .env.selfhost.example
      - .github/workflows/i18n-branding.yml

jobs:
  i18n-branding:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_AUTH_MODE: local-jwt
      NEXT_PUBLIC_DEFAULT_LOCALE: zh-CN
      NEXT_PUBLIC_BRAND_APP_NAME: AI Protocol Platform
      NEXT_PUBLIC_BRAND_PRIMARY_HSL: 199 89% 48%
      NEXT_PUBLIC_BRAND_PRIMARY_FOREGROUND_HSL: 210 40% 98%
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Verify dictionary parity and interpolation
        shell: bash
        run: |
          set -euo pipefail
          tests=(src/lib/__tests__/i18n.test.ts)
          while IFS= read -r -d '' file; do
            tests+=("$file")
          done < <(find src/lib/__tests__ -maxdepth 1 -type f -name '*I18n.test.ts' -print0 | sort -z)
          CI=true npm run test:run -- "${tests[@]}"

      - name: Verify Tenant admin compatibility
        run: CI=true npm run test:run -- src/components/admin/__tests__/tenantAdmin.test.tsx src/components/admin/__tests__/tenantHealth.test.tsx src/components/admin/__tests__/EffectiveAccessPanel.test.tsx

      - name: Verify Skill Studio compatibility
        run: CI=true npm run test:run -- src/components/studio/__tests__/AccessControlEditor.test.tsx src/components/studio/__tests__/AuthoringCopilot.test.tsx src/components/studio/__tests__/DelegationEditor.test.tsx src/components/studio/__tests__/StudioBuilderForm.test.tsx

      - name: Verify Chat core compatibility
        run: >-
          CI=true npm run test:run --
          src/components/chat/__tests__/ChatCoreLabels.test.tsx
          src/components/chat/__tests__/AssistantIntroBubble.test.tsx
          src/components/chat/__tests__/ChatPlacementForms.test.tsx
          src/components/chat/__tests__/InContextBadge.test.tsx
          src/components/chat/__tests__/SkillSessionPanel.test.tsx
          src/components/chat/__tests__/WorkbenchHome.test.tsx
          src/components/chat/__tests__/WorkbenchIndex.test.tsx
          src/components/chat/__tests__/ChatShell.composer.test.tsx
          src/components/chat/__tests__/ChatShell.workspaceHome.test.tsx
          src/components/chat/__tests__/ChatShell.closeArtefactTab.test.tsx
          src/components/chat/__tests__/ChatShell.pricesArtefact.test.tsx

      - name: Build Chinese-default self-host frontend
        run: npm run build

      - name: Reject legacy brand defaults in migrated core surfaces
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          files=(
            frontend/src/lib/branding.ts
            frontend/src/app/layout.tsx
            frontend/src/app/page.tsx
            frontend/src/app/admin/page.tsx
            frontend/src/components/landing/Hero.tsx
            frontend/src/components/landing/ProtocolStripe.tsx
            frontend/src/components/landing/AudienceBand.tsx
          )
          if grep -Ein 'Sunholo|Aitana' "${files[@]}"; then
            echo "Legacy brand name found in a migrated user-facing core surface." >&2
            exit 1
          fi
