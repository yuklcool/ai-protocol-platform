name: A2UI live self-host acceptance

on:
  push:
    branches: [main]
    paths:
      - docker-compose.yml
      - .env.selfhost.example
      - backend/adk/**
      - backend/auth/**
      - backend/protocols/a2ui_surface_action_routes.py
      - backend/protocols/a2ui_surface_data_routes.py
      - backend/protocols/sessions_route.py
      - backend/protocols/session_bootstrap_routes.py
      - backend/scripts/seed_a2ui_live.py
      - backend/skills/**
      - frontend/e2e/a2ui-live.spec.js
      - frontend/src/app/chat/**
      - frontend/src/components/chat/**
      - frontend/src/components/protocols/**
      - frontend/src/providers/SurfaceRegistry.tsx
      - frontend/src/hooks/useSessionMessages.ts
      - frontend/src/lib/localJwtAuth.ts
      - .github/workflows/a2ui-live-acceptance.yml
  pull_request:
    paths:
      - docker-compose.yml
      - .env.selfhost.example
      - backend/adk/**
      - backend/auth/**
      - backend/protocols/a2ui_surface_action_routes.py
      - backend/protocols/a2ui_surface_data_routes.py
      - backend/protocols/sessions_route.py
      - backend/protocols/session_bootstrap_routes.py
      - backend/scripts/seed_a2ui_live.py
      - backend/skills/**
      - frontend/e2e/a2ui-live.spec.js
      - frontend/src/app/chat/**
      - frontend/src/components/chat/**
      - frontend/src/components/protocols/**
      - frontend/src/providers/SurfaceRegistry.tsx
      - frontend/src/hooks/useSessionMessages.ts
      - frontend/src/lib/localJwtAuth.ts
      - .github/workflows/a2ui-live-acceptance.yml

jobs:
  a2ui-live:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      AUTH_BACKEND: local-jwt
      JWT_SIGNING_KEY: a2ui-live-ci-signing-key-at-least-32-bytes-long
      JWT_ISSUER: ai-protocol-platform-a2ui-live-ci
      JWT_AUDIENCE: ai-protocol-platform-a2ui-live-ci
      JWT_EXPIRE_MINUTES: "60"
      SELFHOST_ADMIN_EMAIL: admin@example.com
      SELFHOST_ADMIN_PASSWORD: ci-a2ui-live-admin-password
      PLATFORM_DEFAULT_MODEL: lite
      OPENAI_API_KEY: ci-placeholder-not-a-real-key
      OPENAI_API_BASE: http://model-gateway.invalid/v1
      SKIP_QUALITY_CHECKS: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate acceptance syntax
        run: |
          python -m py_compile backend/scripts/seed_a2ui_live.py
          node --check frontend/e2e/a2ui-live.spec.js
          docker compose config --quiet

      - name: Build A2UI self-host browser stack
        run: docker compose build backend mcp-sandbox frontend

      - name: Start PostgreSQL backend frontend and sandbox
        run: |
          docker compose up -d postgres backend mcp-sandbox frontend
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:1956/health >/dev/null \
              && curl -fsS http://127.0.0.1:3456/api/health >/dev/null \
              && curl -fsS http://127.0.0.1:3457/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs postgres backend mcp-sandbox frontend
          exit 1

      - name: Install Chromium acceptance runner
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run persisted A2UI surface browser acceptance
        working-directory: frontend
        env:
          A2UI_LIVE_RUN_ID: a2ui-${{ github.run_id }}
          A2UI_LIVE_FRONTEND_URL: http://localhost:3456
          A2UI_LIVE_BACKEND_URL: http://127.0.0.1:1956
        run: npx playwright test e2e/a2ui-live.spec.js --reporter=line --workers=1

      - name: Show service logs on failure
        if: failure()
        run: docker compose logs postgres backend mcp-sandbox frontend

      - name: Stop services and remove acceptance volumes
        if: always()
        run: docker compose down -v --remove-orphans
