name: Temporary Chat i18n context

on:
  push:
    branches:
      - feat/i18n-chat-presentation
    paths:
      - .github/workflows/chat-i18n-context-temp.yml

jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print contexts
        run: |
          echo '=== ChatMessageList ==='
          sed -n '395,480p' frontend/src/components/chat/ChatMessageList.tsx
          echo '=== Activity ==='
          sed -n '310,410p' frontend/src/components/chat/ActivityPanel.tsx
          echo '=== MessageBubble ==='
          sed -n '285,330p' frontend/src/components/chat/MessageBubble.tsx
          echo '=== ReadAloud ==='
          sed -n '365,385p' frontend/src/components/chat/ReadAloudButton.tsx
          echo '=== CodeBlock ==='
          sed -n '75,135p' frontend/src/components/chat/CodeBlock.tsx
          echo '=== ResizeHandle ==='
          sed -n '145,170p' frontend/src/components/chat/WorkbenchResizeHandle.tsx
