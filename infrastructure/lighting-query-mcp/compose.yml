services:
  lighting-query-mcp:
    image: ghcr.io/yuklcool/ai-protocol-platform-backend:v2.4.3
    restart: unless-stopped
    entrypoint: [/app/.venv/bin/python, /adapter/serve.py]
    working_dir: /adapter
    environment:
      PYTHONPATH: /app
      PYTHONDONTWRITEBYTECODE: '1'
    volumes:
      - .:/adapter:ro
      - ./private:/run/lighting:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 64
    networks: [platform, agent-runtime-internal]
    healthcheck:
      test: [CMD, /app/.venv/bin/python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8012/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  platform:
    external: true
    name: ai-protocol-platform
  agent-runtime-internal:
    external: true
    name: agent-runtime-internal
