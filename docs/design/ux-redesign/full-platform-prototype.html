  return list.map(t=>'<div class="item"><div class="iconbox neutral">'+icon(t.kind==='文档分析'?'fileSearch':'layers')+'</div><div class="grow"><div class="itemtitle">'+esc(t.title)+'</div><div class="tiny"><span class="mono">TASK-'+t.id+'</span> &nbsp;·&nbsp; '+esc(t.kind)+' &nbsp;·&nbsp; '+esc(t.time)+'</div></div>'+state(t.state)+'<button class="rowbtn" data-task="'+t.id+'" aria-label="打开任务：'+esc(t.title)+'">继续'+icon('arrowUpRight','sm')+'</button></div>').join('')||'<div class="empty"><div class="emptySymbol">'+icon('search','lg')+'</div><h2>没有匹配的任务</h2><p>试试其他关键词，或将状态切换为「全部」。</p></div>';
}

function switchNav() {
  document.getElementById('role').value=s.role;
  const groups=navUser.concat(s.role==='admin'?navAdmin:[]);
  document.getElementById('nav').innerHTML=groups.map(g=>'<div class="groupname">'+g[0]+'</div><div class="nav">'+g[1].map(i=>'<button class="navbtn '+(s.page===i[0]?'on':'')+'" data-go="'+i[0]+'" '+(s.page===i[0]?'aria-current="page"':'')+'><span class="ic">'+icon(i[1])+'</span><span>'+i[2]+'</span>'+(i[0]==='tasks'&&s.tasks.some(t=>t.state==='needs_input')?'<span class="navCount">'+s.tasks.filter(t=>t.state==='needs_input').length+'</span>':'')+'</button>').join('')+'</div>').join('');
}

function home() {
  const waiting=s.tasks.filter(t=>t.state==='needs_input');
  return head('home','把进行中的工作、需要你确认的事项与最近成果，放在一起。',button('新建对话','newTask','primary'))+

}

function chat() {
  const t=s.tasks.find(x=>x.id===s.taskId)||s.tasks[0];
  const step=Math.max(0,Math.min(3,t.step||0));
  const completed=t.state==='completed', waiting=t.state==='needs_input', failed=t.state==='failed', draft=t.state==='draft';
  const timeline=['理解目标与解析资料','核查条款与关键证据','整理分析与交付建议'].map((name,i)=>{
    const done=i<step||completed;
    return '<div class="timelineStep '+(done?'done':i===step?'current':'')+'"><div class="counter">'+(done?icon('check','sm'):i+1)+'</div><div><strong>'+name+'</strong><small>'+(done?'已完成':failed&&i===step?'执行中断':i===step&&!draft?'进行中':'待开始')+'</small></div></div>';
  }).join('');
  const controls=failed?button('重试这一步','retryInline','primary sm')+button('重新开始','resetCurrent','ghost sm'):draft?button('开始演示执行','startInline','primary sm')+button('调整要求','editInline','ghost sm'):t.state==='running'?button('推进演示步骤','nextInline','primary sm')+button('预览失败状态','failInline','ghost sm'):'';
  const plan='<section class="richPanel compactPlan" data-testid="inline-task-plan"><div class="richPanelTitle"><h3>'+icon('listChecks')+'任务计划</h3><div class="aguiMetrics">'+step+' / 3 步骤</div></div><div class="richContent">'+(failed?'<div class="errorInline">文件解析步骤中断。你可以重试当前步骤，或调整输入资料。</div>':'')+'<div class="stepTrack">'+timeline+'</div><div class="aguiProgress" role="progressbar" aria-label="演示任务进度" aria-valuemin="0" aria-valuemax="3" aria-valuenow="'+step+'"><i style="width:'+step/3*100+'%"></i></div><div class="planFooter"><details class="nativeDebug"><summary>执行记录与协议说明</summary><p>这是本页模拟的三步业务计划。正式产品由真实 AG-UI Run / Tool / State 事件驱动，并通过已授权的 A2UI Action 继续执行。</p></details><div class="aguiControls">'+controls+'</div></div></div></section>';
  const approval=waiting?'<section class="richPanel approvalPanel" id="inlineApproval" data-testid="inline-a2ui-form"><div class="richPanelTitle"><h3>'+icon('sliders')+'交付设置</h3>'+state('needs_input')+'</div><div class="richContent"><div class="approvalIntro"><div><h2>分析已就绪，由你决定下一步。</h2><p>选择报告形式，确认后在这段对话中生成成果。</p></div><div class="riskSummary"><b>03</b><small>项风险需优先核查</small></div></div><div class="approvalOptions"><div class="agentField"><label for="inlineResultType">报告形式</label><select id="inlineResultType">'+['详细报告','摘要报告','执行建议清单'].map(k=>'<option '+(s.reportKind===k?'selected':'')+'>'+k+'</option>').join('')+'</select></div><label class="agentCheckbox"><input type="checkbox" id="inlineSuggestions" '+(s.includeSuggestions?'checked':'')+'><span>包含优化建议<small>随报告一并整理可执行的下一步</small></span></label></div><div class="aguiControls">'+button('确认并生成报告','approveInline','primary sm')+button('调整要求','editInline','sm')+button('取消执行','cancelInline','ghost sm')+'</div></div></section>':'';
  const technical=t.kind==='技术分析';
  const report=completed?'<section class="richPanel" data-testid="inline-result"><div class="richPanelTitle"><h3>'+icon('file')+'交付成果</h3>'+state('completed')+'</div><div class="richContent"><div class="reportBanner"><div class="iconbox">'+icon(technical?'layers':'fileSearch')+'</div><div><h2>'+(technical?'技术方案评审':'合同风险分析')+' · '+esc(s.reportKind)+'</h2><p><span class="mono">TASK-'+t.id+'</span> &nbsp;·&nbsp; '+(s.reportSaved?'已保存演示草稿':'可编辑草稿')+'</p></div></div><div class="reportStats"><div><b>'+(technical?'03':'08')+'</b><span>'+(technical?'评审维度':'待核查条款')+'</span></div><div><b>'+(technical?'02':'03')+'</b><span>'+(technical?'改进建议':'优先风险')+'</span></div><div><b>02</b><span>参考材料</span></div></div><div class="resultText">'+esc(s.includeSuggestions?s.report:s.report.split('三、建议')[0])+'</div>'+(s.showReportEditor?'<div class="agentField"><label for="inlineReportEditor">编辑报告草稿</label><textarea id="inlineReportEditor" rows="8">'+esc(s.report)+'</textarea></div>':'')+'<div class="aguiControls">'+(s.showReportEditor?button('保存草稿','saveInlineReport','primary sm'):button('编辑草稿','editInlineReport','sm'))+button('下载演示 TXT','export','sm')+button('继续讨论','focusChat','ghost sm')+'</div></div></section>':'';
  const messages=s.messages.map((m,i)=>'<div class="turn '+(m.who==='user'?'userTurn':'')+'"><div class="turnIcon">'+icon('sparkles','sm')+'</div><div class="turnBody"><div class="turnLabel"><b>'+(m.who==='user'?'你':'AI 助手')+'</b><span class="mono">'+(i<2?'09:42':'刚刚')+'</span></div><div class="turnText">'+esc(m.text)+'</div>'+(m.who!=='user'&&i===1?plan+approval+report:'')+'</div></div>').join('');
  const welcome='<div class="welcome"><div class="welcomeMark">'+icon('orbit','lg')+'</div><div class="kicker">YOUR NEXT IDEA STARTS HERE</div><h2>把想法，变成下一步。</h2><p>说说你想完成什么。资料、计划与成果，都留在同一段对话。</p><div class="promptGrid">'+[['fileSearch','审阅一份合同','找出风险，整理建议','分析合同风险并生成可编辑报告'],['columns','对比两份方案','看清差异，辅助决策','对比两份技术方案的差异与风险'],['library','整理研究资料','提取要点，保留来源','整理资料要点并生成结构化研究报告']].map(x=>'<button class="promptCard" data-chat-prompt="'+esc(x[3])+'">'+icon(x[0])+'<b>'+x[1]+'</b><small>'+x[2]+'</small></button>').join('')+'</div></div>';
  return '<div class="chatNative"><header class="chatNativeHeader"><div class="chatHeaderTitle"><span class="chatAvatar">'+icon('orbit')+'</span><div><h1>'+(s.messages.length?esc(t.title):'新的对话')+'</h1><small>'+(s.messages.length?'<span class="mono">TASK-'+t.id+'</span> &nbsp; / &nbsp; 文档、分析与决策':'让复杂工作，从一句话开始。')+'</small></div></div><div class="actions">'+(s.messages.length?state(t.state):'')+button('新对话','newTask','ghost sm')+'</div></header><div class="chatLog" id="chatLog" tabindex="0" aria-label="对话与任务内容">'+(s.messages.length?'<div class="conversationDate">今天 · 示例会话</div>'+messages:welcome)+'</div>'+composer()+'</div>';
}

function tasks() {
  const q=s.search.toLowerCase();
  const list=s.tasks.filter(t=>(s.taskFilter==='all'||t.state===s.taskFilter)&&(t.title.toLowerCase().includes(q)||String(t.id).includes(q)));
  return head('tasks','每段对话的目标、进展和上下文，都在这里继续。',button('新建对话','newTask','primary'))+'<div class="metricsStrip"><div><b>'+s.tasks.length+'</b><span>全部任务</span></div><div><b>'+s.tasks.filter(t=>t.state==='needs_input').length+'</b><span>待确认</span></div><div><b>'+s.tasks.filter(t=>t.state==='completed').length+'</b><span>已完成</span></div><div><b>'+s.tasks.filter(t=>t.state==='failed').length+'</b><span>需处理</span></div></div><section class="card pad"><div class="filters"><input id="taskSearch" aria-label="搜索任务" placeholder="搜索任务名称或编号" value="'+esc(s.search)+'"><select id="taskStatus" aria-label="筛选任务状态"><option value="all">全部状态</option>'+Object.keys(statusText).map(k=>'<option value="'+k+'" '+(s.taskFilter===k?'selected':'')+'>'+statusText[k]+'</option>').join('')+'</select>'+button('查询','filterTasks','sm')+'</div><div class="listHead"><span>任务 / 上下文</span><span>'+list.length+' 个结果</span></div>'+taskRows(list)+'</section>'+info();
}

function results() {
  const list=s.tasks.filter(t=>t.result&&(s.resultFilter==='all'||t.kind===s.resultFilter));
  return head('results','让每一次分析，都有可以回看和继续打磨的成果。',button('打开当前报告','openCurrent','primary'))+'<div class="filters"><select id="resultFilter" aria-label="筛选成果类型"><option value="all">全部成果</option>'+['文档分析','技术分析'].map(k=>'<option '+(s.resultFilter===k?'selected':'')+'>'+k+'</option>').join('')+'</select><span class="filterCount">'+list.length+' 份示例成果</span></div><div class="grid3">'+list.map(t=>'<article class="card artifactCard">'+reportCover(t)+'<div class="artifactDetails"><div class="artifactMeta"><span class="tag">'+esc(t.kind)+'</span>'+state(t.state)+'</div><h3>'+esc(t.title)+'</h3><p>结构化分析、关键结论与后续建议。</p><div class="tiny"><span class="mono">TASK-'+t.id+'</span> · '+esc(t.time)+'</div><div class="actions mt15">'+button('预览成果','preview:'+t.id,'sm')+button('继续原任务','task:'+t.id,'ghost sm')+'</div></div></article>').join('')+'</div>'+info();

const pages={landing,home,chat,tasks,results,skills,studio,profile,onboarding,agent,models,mcp,knowledge,users,trace,audit,platform,protocol};
function render() {
  const oldChat=document.getElementById('chatLog');
  const chatTop=oldChat?.scrollTop||0;
  const atEnd=!oldChat||oldChat.scrollHeight-chatTop-oldChat.clientHeight<40;
  if(s.role!=='admin'&&navAdmin.some(g=>g[1].some(i=>i[0]===s.page)))s.page='chat';
  closeDialog(false);
  toggleMenu(false);
  switchNav();
  const main=document.querySelector('.main');
  main.dataset.page=s.page==='chat'&&s.viewState!=='normal'?'chatState':s.page;
  document.getElementById('crumb').innerHTML='<span class="crumbParent">工作空间</span><span class="crumbParent">/</span><b>'+titles[s.page][0]+'</b>';
  document.getElementById('statePreview').value=s.viewState;
  document.getElementById('view').innerHTML=s.viewState==='normal'?pages[s.page]():specialState();
  const chatLog=document.getElementById('chatLog');
  if(chatLog)chatLog.scrollTop=atEnd?chatLog.scrollHeight:chatTop;
  ['personLanguage','skillOwner','platformLocale'].forEach(id=>{const el=document.getElementById(id);if(el&&s[fieldState[id]])el.value=s[fieldState[id]];});
  document.getElementById('currentUserName').textContent=s.userName;
}

function go(page) {
  captureDrafts();
  s.page=page;
  s.viewState='normal';
  render();
  document.querySelector('.main').scrollTop=0;
  const chatLog=document.getElementById('chatLog');
  if(chatLog)chatLog.scrollTop=chatLog.scrollHeight;
  const heading=document.querySelector('#view h1');
  if(heading){heading.tabIndex=-1;heading.focus({preventScroll:true});}
}

function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("visible");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("visible"),3400);}
function modal(title, content, actionName, label) {
  captureDrafts();
  modalAction=actionName;
  modalReturnFocus=document.activeElement;
  document.getElementById('modal').innerHTML='<div class="dialogwrap"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"><div class="between"><h2 id="dialogTitle">'+esc(title)+'</h2><button class="btn ghost iconButton" data-action="closeModal" aria-label="关闭弹窗">'+icon('x')+'</button></div>'+content+'<div class="dialogActions">'+button('取消','closeModal')+button(label||'确认','confirmModal','primary')+'</div></div></div>';
  const input=document.querySelector('.dialog input');
  if(input&&!input.labels.length)input.setAttribute('aria-label',input.placeholder||title);
  document.querySelector('.main').inert=true;
  document.getElementById('sidebar').inert=true;
  (input||document.querySelector('.dialog')).focus();
}

function taskSelect(id) {
  captureDrafts();
  const previous=s.tasks.find(task=>task.id===s.taskId);
  if(previous)previous.report=s.report;
  const task=s.tasks.find(item=>item.id===id);
  if(!task)return;
  s.taskId=id;
  s.reportSaved=Boolean(task.reportSaved);
  s.showReportEditor=false;
  s.report=task.report||(task.kind==='技术分析'?'一、评审结论\n方案具备可实施的基础，需要进一步明确接口边界与验证标准。\n\n二、评审维度\n1. 架构职责与依赖是否清晰。\n2. 数据流与权限边界是否完整。\n3. 实施和回滚路径是否可验证。\n\n三、建议\n1. 补充关键接口契约。\n2. 先验证最小端到端流程，再逐步扩展。':defaults.report);
  s.messages=[{who:'user',text:task.title},{who:'ai',text:task.state==='completed'?'成果已整理在下面。你可以编辑草稿、下载演示文本，或继续讨论。':task.state==='failed'?'任务在资料处理时中断。请查看当前步骤，选择重试或调整要求。':'分析进度与待确认操作都在下面，可以从这里继续。'}];
  s.chatDraft='';
  const oldInput=document.getElementById('chatInput');
  if(oldInput)oldInput.value='';
  go('chat');
}

function createTask(text) {
  captureDrafts();
  const previous=s.tasks.find(task=>task.id===s.taskId);
  if(previous)previous.report=s.report;
  const blank=text==='新的任务';
  const reuse=!s.messages.length&&previous?.state==='draft';
  const id=reuse?previous.id:Math.max(...s.tasks.map(x=>x.id))+1;
  const next={id,title:blank?'新的对话':text,state:'draft',kind:'自定义任务',time:'刚刚',step:0,result:false};
  if(reuse)Object.assign(previous,next);else s.tasks.unshift(next);
  s.taskId=id;
  s.tab='plan';
  s.messages=blank?[]:[{who:'user',text},{who:'ai',text:'我会先梳理目标与资料，再核查关键信息，最后整理可编辑的成果。下面可以演示这份计划的执行过程。'}];
  if(!reuse||blank)s.files=[];
  s.report=defaults.report;
  s.reportSaved=false;
  s.chatDraft='';
  s.reportKind='详细报告';
  s.showReportEditor=false;
  // The new task must not inherit the previous conversation's input field.
  const oldInput=document.getElementById('chatInput');
  if(oldInput)oldInput.value='';
  go('chat');
}

function download(){const b=new Blob(["AI Protocol Platform / 演示文本成果\n\n"+s.report],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download="演示风险分析报告.txt";a.click();URL.revokeObjectURL(url);toast("已下载演示 TXT；不是后端导出。");}
function action(act){const parts=act.split(":"),cmd=parts[0],arg=parts.slice(1).join(":");
captureDrafts();
if(cmd==='removeFile'){s.files.splice(+arg,1);render();return;}
if(cmd==='goChat'){s.role='user';go('chat');return;}
if(cmd==='closeModal'){closeDialog(true);return;}
if(cmd==='preview'){taskSelect(+arg);return;}
if(cmd==='protocolApprove'){if(!s.protocolRead){toast('请先阅读并勾选确认项');document.getElementById('protocolRead').focus();return;}s.protocolConfirmed=true;render();toast('示例动作已确认，未发送实际请求');return;}
if(cmd==='saveSkill'){if(!s.skillTitle?.trim()){toast('请填写技能名称');return;}if(!s.enabledSkills.includes(s.skillTitle))s.enabledSkills.push(s.skillTitle);render();toast('Skill 演示草稿已保存');return;}
if(cmd==='savePlatform'){render();toast('平台设置已保存到本页演示状态');return;}
if(cmd==='testConfig'&&(!s.modelTest||!s.configSaved)){toast('请先完成模型能力测试，并保存 Agent 配置草稿');return;}
if(cmd==='testModel'){try{const endpoint=new URL(s.providerURL);if(!['http:','https:'].includes(endpoint.protocol)||!s.providerModel.trim()||!s.providerName.trim())throw new Error();}catch{toast('请填写服务名称、有效 API 地址和模型 ID');return;}}
if(cmd==='send'&&!s.messages.length){const input=document.getElementById('chatInput');const text=input.value.trim();if(text)createTask(text);return;}
if(cmd==="startInline"){const t=s.tasks.find(x=>x.id===s.taskId);t.state="running";t.step=1;render();toast("模拟 AG-UI 开始执行（未调用后端）");return;}
if(cmd==="nextInline"){const t=s.tasks.find(x=>x.id===s.taskId);t.step=Math.min(3,(t.step||0)+1);if(t.step>=3){t.state="needs_input";t.result=true;}render();toast("模拟 AG-UI 进度事件，更新聊天内原卡片");return;}
if(cmd==="failInline"){const t=s.tasks.find(x=>x.id===s.taskId);t.state="failed";render();toast("模拟执行失败，聊天内显示重试入口");return;}
if(cmd==="retryInline"){const t=s.tasks.find(x=>x.id===s.taskId);t.state="running";t.step=Math.max(1,t.step||1);render();toast("仅恢复模拟界面，不会重新触发真实工具");return;}
if(cmd==="cancelInline"){const t=s.tasks.find(x=>x.id===s.taskId);t.state="draft";t.step=0;render();toast("模拟取消，正式版必须由后端处理取消状态");return;}
if(cmd==="resetCurrent"){const t=s.tasks.find(x=>x.id===s.taskId);t.state="draft";t.step=0;render();return;}
if(cmd==="approveInline"){const t=s.tasks.find(x=>x.id===s.taskId);s.reportKind=document.getElementById("inlineResultType")?.value||"详细报告";s.includeSuggestions=Boolean(document.getElementById("inlineSuggestions")?.checked);t.state="completed";t.step=3;t.result=true;s.showReportEditor=false;s.messages.push({who:"ai",text:"报告已整理完成。你可以继续编辑草稿，或一起核查关键条款。"});render();toast("模拟确认已完成，未向后端发送 Action");return;}
if(cmd==="editInline"){const el=document.getElementById("chatInput");if(el){el.value="请调整任务要求：";el.focus();}return;}
if(cmd==="focusChat"){document.getElementById("chatInput")?.focus();return;}
if(cmd==="focusConfirm"){document.getElementById("inlineApproval")?.scrollIntoView({behavior:"smooth",block:"center"});return;}
if(cmd==="editInlineReport"){s.showReportEditor=true;render();document.getElementById("inlineReportEditor")?.focus();return;}
if(cmd==="saveInlineReport"){const el=document.getElementById("inlineReportEditor");if(el)s.report=el.value;s.showReportEditor=false;s.reportSaved=true;const reportTask=s.tasks.find(task=>task.id===s.taskId);if(reportTask){reportTask.report=s.report;reportTask.reportSaved=true;}render();toast("已保存浏览器内演示草稿（非服务端持久化）");return;}
if(cmd==="newTask"){createTask("新的任务");return;}if(cmd==="goHome")return go("home");if(cmd==="normalView"){s.viewState="normal";return render();}if(cmd==="toSkills")return go("skills");if(cmd==="testSkill")return toast("模拟技能测试；实际需要授权模型和测试数据");if(cmd==="goAgent")return go("agent");if(cmd==="goLanding")return go("landing");if(cmd==="goOnboarding"){s.role="admin";return go("onboarding");}if(cmd==="goStudio")return go("studio");if(cmd==="goProtocol")return go("protocol");if(cmd==="saveSkill"){const n=document.getElementById("skillTitle")?.value.trim();if(!n)return toast("请填写技能名称");if(!s.enabledSkills.includes(n))s.enabledSkills.push(n);return toast("技能草稿已记录（原型演示）");}if(cmd==="savePlatform")return toast("平台设置草稿已保存（演示，不改变真实配置）");if(cmd==="protocolApprove")return toast("A2UI 示例动作已确认；正式版应校验会话、权限和幂等键");if(cmd==="startTask"){let v=document.getElementById("homePrompt").value.trim();if(!v)return toast("请输入任务目标");createTask(v);return;}
if(cmd==="openCurrent")return taskSelect(s.taskId);if(cmd==="task")return taskSelect(+arg);if(cmd==="toTrace"){if(s.role!=="admin")return toast("请先切换为平台管理员演示视角");return go("trace");}
if(cmd==="send"){const el=document.getElementById("chatInput"),v=el.value.trim();if(!v)return;s.messages.push({who:"user",text:v},{who:"ai",text:"已记录补充要求。可以继续调整报告草稿，或开始一项新的工作。"});s.reportSaved=false;s.chatDraft="";el.value="";render();document.getElementById("chatLog").scrollTo({top:document.getElementById("chatLog").scrollHeight});document.getElementById("chatInput").focus();toast("已发送演示消息，没有访问真实模型。");return;}
if(cmd==="attach"){document.getElementById("filepick").click();return;}
if(cmd==="advance"){let t=s.tasks.find(x=>x.id===s.taskId);if(t.state==="completed")return toast("任务已完成");if(t.state==="failed")t.state="running";if(t.step<3){t.step++;t.state="running";}else{t.step=3;t.state="needs_input";t.result=true;}render();toast("已推进演示状态，不代表后台执行。");return;}
if(cmd==="approve"){let t=s.tasks.find(x=>x.id===s.taskId);t.state="completed";t.step=4;t.result=true;s.reportSaved=true;render();toast("演示成果已确认，真实平台需要受控动作和审计。");return;}
if(cmd==="saveReport"){const el=document.getElementById("reportEditor");if(el)s.report=el.value;s.reportSaved=true;render();toast("草稿保存到本次演示状态");return;}
if(cmd==="export")return download();if(cmd==="tabResult"){s.tab="result";return render();}if(cmd==="tabSource"){s.tab="source";return render();}
if(cmd==="filterTasks"){s.search=document.getElementById("taskSearch").value;s.taskFilter=document.getElementById("taskStatus").value;return render();}if(cmd==="filterResults"){s.resultFilter=document.getElementById("resultFilter").value;return render();}
if(cmd==="preview"){s.taskId=+arg;s.tab="result";go("chat");return;}
if(cmd==="goProfile")return go("profile");if(cmd==="goModels")return go("models");
if(cmd==="saveProfile"){s.userName=document.getElementById("personName").value;s.pref=document.getElementById("personPref").value;render();return toast("个人配置已更新（仅模拟）");}
if(cmd==="saveConfig"){s.configSaved=true;render();return toast("示例配置草稿已保存，尚未发布");}
if(cmd==="testConfig"){s.configTested=true;render();return toast("模拟 Agent 验证完成，无真实模型调用");}
if(cmd==="saveProvider"){s.providerName=document.getElementById("providerName").value;s.providerURL=document.getElementById("providerURL").value;s.providerModel=document.getElementById("providerModel").value;render();return toast("模型配置已修改（演示）");}
if(cmd==="testModel"){s.modelTest=true;render();return toast("模拟文本及 Tool Calling 测试通过；不代表真实验证");}
if(cmd==="saveMcp"){s.mcpName=document.getElementById("mcpName").value;s.mcpURL=document.getElementById("mcpURL").value;render();return toast("MCP 示例配置已更新");}
if(cmd==="testMcp"){s.mcpTest=true;render();return toast("模拟 MCP 连接成功，并非真实网络测试");}
if(cmd==="skill"){if(s.enabledSkills.includes(arg))s.enabledSkills=s.enabledSkills.filter(x=>x!==arg);else s.enabledSkills.push(arg);render();return;}
if(cmd==="addKnowledge")return modal("新增知识资源","<p class='muted'>输入演示资源名称；此操作不会上传文件。</p><input class='w100' id='modalText' placeholder='资源名称'>","knowledge","添加");
if(cmd==="deleteKnowledge"){s.knowledge.splice(+arg,1);return render();}
if(cmd==="modelModal")return modal("添加模型服务","<p class='muted'>原型只记录名称，正式版接入需要完整测试及安全凭证管理。</p><input class='w100' id='modalText' placeholder='服务名称'>","provider","添加");
if(cmd==="mcpModal")return modal("添加 MCP 服务","<p class='muted'>新增服务后必须执行健康检查、工具发现及 Root 授权验证。</p><input class='w100' id='modalText' placeholder='MCP 名称'>","mcp","添加");
if(cmd==="userModal")return modal("添加演示用户","<div class='field'><label>邮箱</label><input class='w100' id='modalText' type='email' placeholder='name@example.com'></div><div class='field mt15'><label>角色</label><select id='modalRole' class='w100'><option>用户</option><option>管理员</option></select></div>","user","添加");
if(cmd==="toggleUser"){s.users[+arg].status=s.users[+arg].status==="启用"?"停用":"启用";return render();}
if(cmd==="closeModal"){document.getElementById("modal").innerHTML="";return;}
if(cmd==="confirmModal"){let v=document.getElementById("modalText")?.value.trim();if(!v)return toast("请填写必要内容");if(modalAction==="knowledge")s.knowledge.push(v);if(modalAction==="provider")s.providerName=v;if(modalAction==="mcp")s.mcpName=v;if(modalAction==="user"){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return toast("请填写有效邮箱");s.users.push({name:v.split("@")[0],email:v,role:document.getElementById("modalRole").value,status:"启用"});}render();toast("已添加演示项目");return;}
}
document.addEventListener("click",function(e){let el=e.target.closest("[data-go],[data-action],[data-task],[data-tab],[data-prompt]");if(!el)return;if(el.dataset.go){go(el.dataset.go);return;}if(el.dataset.action){action(el.dataset.action);return;}if(el.dataset.task){taskSelect(+el.dataset.task);return;}if(el.dataset.tab){if(s.tab==="result"){let ed=document.getElementById("reportEditor");if(ed)s.report=ed.value;}s.tab=el.dataset.tab;render();return;}if(el.dataset.prompt){s.draft=el.dataset.prompt;document.getElementById("homePrompt").value=s.draft;return;}});
document.addEventListener("change",function(e){const el=e.target;if(el.id==="role"){s.role=el.value;if(el.value==="admin")s.page="agent";else s.page="chat";render();}if(el.dataset.skill){if(el.checked){if(!s.enabledSkills.includes(el.dataset.skill))s.enabledSkills.push(el.dataset.skill);}else s.enabledSkills=s.enabledSkills.filter(x=>x!==el.dataset.skill);}if(el.dataset.cap){if(el.checked){if(!s.capabilities.includes(el.dataset.cap))s.capabilities.push(el.dataset.cap);}else s.capabilities=s.capabilities.filter(x=>x!==el.dataset.cap);}if(el.id==="skillFilter"){s.skillFilter=el.value;render();}if(el.id==="resultFilter"){s.resultFilter=el.value;render();}});
document.getElementById("statePreview").addEventListener("change",function(e){s.viewState=e.target.value;render();});

document.getElementById("reset").addEventListener("click",function(){document.getElementById("view").innerHTML="";s=structuredClone(defaults);render();toast("已重置为默认演示数据");});
document.getElementById("filepick").addEventListener("change",function(e){let a=Array.from(e.target.files||[]).map(f=>f.name);s.files=s.files.concat(a);e.target.value="";render();toast("添加了 "+a.length+" 个演示附件名称；文件未上传");});

document.addEventListener('input', captureDrafts);
document.addEventListener('change', captureDrafts);
document.addEventListener('click', event=>{
  const prompt=event.target.closest('[data-chat-prompt]');
  if(prompt){s.chatDraft=prompt.dataset.chatPrompt;const input=document.getElementById('chatInput');input.value=s.chatDraft;input.focus();}
});
document.getElementById('mobileMenu').addEventListener('click',()=>toggleMenu(!document.getElementById('sidebar').classList.contains('open')));
document.getElementById('menuBackdrop').addEventListener('click',()=>{toggleMenu(false);document.getElementById('mobileMenu').focus();});
document.addEventListener('keydown', event=>{
  const dialog=document.querySelector('.dialog');
  const menu=document.getElementById('sidebar').classList.contains('open')?document.getElementById('sidebar'):null;
  if(event.key==='Escape'){
    if(dialog)closeDialog(true);
    else if(menu){toggleMenu(false);document.getElementById('mobileMenu').focus();}
    return;
  }
  if((event.ctrlKey||event.metaKey)&&event.key==='Enter'&&!event.isComposing&&document.activeElement?.id==='chatInput'){
    event.preventDefault();action('send');return;
  }
  const trap=dialog||menu;
  if(event.key!=='Tab'||!trap)return;
  const focusables=Array.from(trap.querySelectorAll('button:not([disabled]),input:not([disabled]),textarea,select,a[href],[tabindex="0"]')).filter(el=>el.getClientRects().length);
  const first=focusables[0],last=focusables[focusables.length-1];
  if(!first)return;
  if(!trap.contains(document.activeElement)||(event.shiftKey&&document.activeElement===first)||(!event.shiftKey&&document.activeElement===last)){
    event.preventDefault();(event.shiftKey?last:first).focus();
  }
});
window.matchMedia('(max-width:1023px)').addEventListener('change',()=>toggleMenu(false));
render();
})();
</script></body></html>
