function audit(){return head("audit","把运行用量、成本估算、异常与审计分层展示；原型不伪造线上财务或请求指标。",button("查看诊断","toTrace",""))+'<div class="grid3">'+stat("今日实际 Token","—","尚未连接后端")+stat("估算费用","—","尚无计费数据")+stat("失败率","—","尚无可用指标")+'</div><div class="grid2 mt25"><div class="card pad"><h2>可视化布局示例</h2><p class="tiny">柱形高度仅用于展示设计，不代表真实统计</p><div class="miniChart">'+[37,64,51,80,65,92,73].map((n,i)=>'<span data-label="'+["四","五","六","日","一","二","三"][i]+'" style="height:'+n+'%"></span>').join("")+'</div></div><div class="card pad"><h2>审计事件</h2>'+s.audit.map(x=>'<div class="item"><div class="grow"><strong>'+esc(x.action)+'</strong><div class="tiny">'+esc(x.who)+' · '+esc(x.at)+'</div></div>'+state("completed")+'</div>').join("")+'</div></div>';}

function landing(){return head("landing","公开入口、认证及进入工作台的最短路径。此演示不连接 OIDC / 本地登录，也不存储认证凭证。",button("进入工作台","goHome","primary"))+'<div class="grid2"><div class="card hero"><div class="kicker">AI FIRST WORKSPACE</div><h2 style="font-size:29px">让 AI 真正完成工作，而不只是回答问题。</h2><p>从目标输入，到执行计划、交互式过程和可追踪成果，把复杂能力收敛到一个工作区。</p><div class="actions">'+button("以普通用户进入","goHome","primary")+button("查看管理员配置引导","goOnboarding","")+'</div></div><div class="card pad"><h2>登录状态设计（模拟）</h2><div class="field mb18"><label>账号邮箱</label><input placeholder="user@example.com" autocomplete="off"></div><div class="field mb18"><label>密码</label><input type="password" placeholder="••••••••" autocomplete="off"></div>'+button("模拟登录并进入工作台","goHome","primary w100")+'<hr class="divider"><p class="tiny">正式系统复用既有 JWT/OIDC 流程；此页面只表达登录页面布局与失败反馈，不是真实登录服务。</p></div></div>';}
function studio(){return head("studio","用于创建与编辑可复用 Skill：能力说明、执行指令、参考资料、测试和归属。不能把 Skill 当作独立 Agent。",button("返回能力中心","toSkills",""))+'<div class="grid2"><div class="card pad"><h2>技能编辑</h2><div class="field mb18"><label>技能名称</label><input id="skillTitle" value="文档审核助手" placeholder="能力名称"></div><div class="field mb18"><label>能完成什么</label><textarea rows="3">检查材料结构，识别重点问题，并生成可核验的结论与建议。</textarea></div><div class="field mb18"><label>执行指令（公开摘要）</label><textarea rows="7">收到资料后先确认目标，列出用户可见的执行步骤，读取有效文档，检查来源，整理结果。对有副作用的操作请求确认。</textarea></div><div class="formgrid"><div class="field"><label>归属</label><select><option>个人专属</option><option>公共（管理员）</option></select></div><div class="field"><label>状态</label><select><option>草稿</option><option>启用</option></select></div></div><div class="actions mt15">'+button("保存技能草稿","saveSkill","primary")+button("测试示例","testSkill","")+'</div></div><div class="stack"><div class="card pad"><h2>资源与示例</h2><div class="item"><span class="grow">参考资料</span><span class="tag">可上传资源文件</span></div><div class="item"><span class="grow">例子与预期输入</span><span class="tag">展示用例</span></div><div class="item"><span class="grow">允许使用的公共工具</span><span class="tag">由 Root 上限约束</span></div><p class="tiny mt15">示例 Skill 不会自动获得 MCP/模型或其他用户的权限。</p></div><div class="card pad"><h2>发布前检查</h2><p class="muted">建议核对指令是否清楚、参考资料是否合法、输出是否可验证、授权是否正确。测试结果应使用真实模型与已授权资源记录。</p>'+button("进入测试任务","newTask","sm")+'</div></div></div>';}
function onboarding(){return head("onboarding","首次部署时的引导式管理流程。把散落的模型、Root、MCP 与权限动作整理成清晰的下一步。",button("开始模型接入","goModels","primary"))+'<div class="card pad"><div class="wizard"><span class="on">1 · 模型</span><span>2 · Root</span><span>3 · 公共技能和工具</span><span>4 · 验证</span></div>'+[['接入和验证模型','完成文本与 Tool Calling 测试','models'],['配置 Root Agent','设定默认模型和公共能力','agent'],['检查 MCP 与知识','确认连接状态和授权范围','mcp'],['试运行并验收','用实际对话验证附件、工具、A2UI','chat']].map((x,i)=>'<div class="item"><div class="iconbox">'+(i+1)+'</div><div class="grow"><strong>'+x[0]+'</strong><div class="tiny">'+x[1]+'</div></div><button class="rowbtn" data-go="'+x[2]+'">进入 →</button></div>').join("")+'</div>'+info();}
function platform(){return head("platform","平台级配置集中维护，向管理员明确说明每项设置的影响范围与保存状态。",button("保存设置草稿","savePlatform","primary"))+'<div class="grid2"><div class="card pad"><h2>品牌与界面</h2><div class="field mb18"><label>产品名称</label><input value="AI Protocol Platform"></div><div class="field mb18"><label>默认语言</label><select><option>简体中文</option><option>English</option></select></div><div class="field mb18"><label>主题方向</label><select><option>明亮蓝白科技风</option><option>系统默认</option></select></div><div class="notice">演示控制不写入部署配置。正式版品牌与主题来自已有统一设计变量。</div></div><div class="card pad"><h2>运行和安全设置</h2><label class="toggle"><input type="checkbox" checked><span class="grow">显示真实运行状态<small>未检测到真实事件时不得伪造成功状态</small></span></label><label class="toggle"><input type="checkbox" checked><span class="grow">审核有副作用的操作<small>用户确认后由后端校验权限</small></span></label><label class="toggle"><input type="checkbox" checked><span class="grow">保留 MCP Apps 不同源隔离<small>沙箱不得被普通主站 iframe 绕过</small></span></label></div></div>';}
function protocol(){return head("protocol","面向研发与管理员的协议调试：显示受控 A2UI 组件、动作事件、MCP Apps 沙箱边界。",button("返回 Agent 配置","goAgent",""))+'<div class="grid2"><div class="card pad"><h2>A2UI 交互示例</h2><div class="notice mb18">本卡片只模拟受控表单外观；生产中须使用平台已有 A2UI v0.9 SDK Basic Catalog。</div><div class="field mb18"><label>审批意见</label><textarea rows="4" placeholder="填写审核说明"></textarea></div><label class="toggle"><input type="checkbox" checked><span class="grow">已阅读分析结论<small>确认操作应经过服务端策略校验</small></span></label>'+button("演示 Surface Action","protocolApprove","primary")+'</div><div class="card pad"><h2>MCP Apps 沙箱边界</h2><div class="outline"><strong>隔离的 App Surface</strong><p class="muted">真正第三方应用 HTML 不能在这个普通内容框里直接任意运行。正式版经独立浏览器 Origin、受限 postMessage 与 JSON-RPC 桥接呈现。</p><span class="tag">隔离示意 · 未加载 MCP Server</span></div><h3 class="mt25">协议调试信息</h3><div class="item"><span class="grow">AG-UI 流事件</span><b>演示</b></div><div class="item"><span class="grow">A2UI v0.9 Surface</span><b>演示</b></div><div class="item"><span class="grow">MCP Apps Origin</span><b>未连接</b></div></div></div>';}
function specialState(){const title=titles[s.page][0],v=s.viewState,descs={loading:["加载中","正在请求「"+title+"」的数据，保留导航、用户上下文和非阻塞操作。"],empty:["暂无内容","该页面当前没有数据。提供显式新建、返回或调整筛选入口。"],error:["读取失败","网络或服务端暂时不可用；失败不等于空数据，不显示虚假的成功状态。"],forbidden:["无访问权限","后端拒绝了当前账号对此资源的读取；隐藏菜单不能代替真实授权。"]};const d=descs[v];return head(s.page,"交互状态规范 · 当前为状态预览，而非真实请求。",button("恢复正常视图","normalView","primary"))+'<div class="card empty" style="padding:85px 20px"><div style="font-size:36px;margin-bottom:16px">'+({loading:"◌",empty:"▢",error:"⚠",forbidden:"⊘"}[v])+'</div><h2 style="font-size:22px">'+d[0]+'</h2><p class="muted">'+d[1]+'</p><div class="actions" style="justify-content:center">'+button(v==="error"?"模拟重试":"返回正常页面","normalView","primary")+button("返回工作台","goHome","")+'</div></div>';}

const pages={landing,home,chat,tasks,results,skills,studio,profile,onboarding,agent,models,mcp,knowledge,users,trace,audit,platform,protocol};
function render(){if(s.role!=="admin"&&navAdmin.some(g=>g[1].some(i=>i[0]===s.page)))s.page="home";switchNav();document.getElementById("crumb").textContent="AI Protocol / "+titles[s.page][0];document.getElementById("statePreview").value=s.viewState;document.getElementById("view").innerHTML=s.viewState==="normal"?pages[s.page]():specialState();document.getElementById("sidebar").classList.remove("open");document.getElementById("modal").innerHTML="";}
function go(p){s.page=p;s.viewState="normal";render();window.scrollTo({top:0,behavior:"instant"});}
function toast(message){const el=document.getElementById("toast");el.textContent=message;el.classList.add("visible");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("visible"),3400);}
function modal(title,content,action,label){modalAction=action;document.getElementById("modal").innerHTML='<div class="dialogwrap" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="between"><h2>'+title+'</h2><button class="btn sm" data-action="closeModal">✕</button></div>'+content+'<div class="dialogActions">'+button("取消","closeModal","")+button(label||"确认","confirmModal","primary")+'</div></div></div>';}
function taskSelect(id){s.taskId=id;s.tab="result";go("chat");}
function createTask(text){const id=Math.max.apply(null,s.tasks.map(x=>x.id))+1;s.tasks.unshift({id:id,title:text||"新的分析任务",state:"running",kind:"自定义任务",time:"刚刚",step:1,result:false});s.taskId=id;s.tab="plan";s.messages=[{who:"user",text:text||"开始新的任务"},{who:"ai",text:"已收到任务目标，并生成初步执行步骤。这是离线模拟，点击「模拟执行下一步」查看状态变化。"}];s.files=[];go("chat");}
function download(){const b=new Blob(["AI Protocol Platform / 演示文本成果\n\n"+s.report],{type:"text/plain;charset=utf-8"}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download="演示风险分析报告.txt";a.click();URL.revokeObjectURL(url);toast("已下载演示 TXT；不是后端导出。");}
function action(act){const parts=act.split(":"),cmd=parts[0],arg=parts.slice(1).join(":");if(cmd==="newTask"){createTask("新的任务");return;}if(cmd==="goHome")return go("home");if(cmd==="normalView"){s.viewState="normal";return render();}if(cmd==="toSkills")return go("skills");if(cmd==="testSkill")return toast("模拟技能测试；实际需要授权模型和测试数据");if(cmd==="goAgent")return go("agent");if(cmd==="goLanding")return go("landing");if(cmd==="goOnboarding"){s.role="admin";return go("onboarding");}if(cmd==="goStudio")return go("studio");if(cmd==="goProtocol")return go("protocol");if(cmd==="saveSkill"){const n=document.getElementById("skillTitle")?.value.trim();if(!n)return toast("请填写技能名称");if(!s.enabledSkills.includes(n))s.enabledSkills.push(n);return toast("技能草稿已记录（原型演示）");}if(cmd==="savePlatform")return toast("平台设置草稿已保存（演示，不改变真实配置）");if(cmd==="protocolApprove")return toast("A2UI 示例动作已确认；正式版应校验会话、权限和幂等键");if(cmd==="startTask"){let v=document.getElementById("homePrompt").value.trim();if(!v)return toast("请输入任务目标");createTask(v);return;}
if(cmd==="openCurrent")return taskSelect(s.taskId);if(cmd==="task")return taskSelect(+arg);if(cmd==="toTrace"){if(s.role!=="admin")return toast("请先切换为平台管理员演示视角");return go("trace");}
if(cmd==="send"){const el=document.getElementById("chatInput"),v=el.value.trim();if(!v)return;s.messages.push({who:"user",text:v},{who:"ai",text:"已收到补充要求。本原型仅模拟消息与布局，正式版由 Google ADK 处理并更新真实执行事件。"});s.reportSaved=false;render();toast("已发送演示消息，没有访问真实模型。");return;}
if(cmd==="attach"){document.getElementById("filepick").click();return;}
if(cmd==="advance"){let t=s.tasks.find(x=>x.id===s.taskId);if(t.state==="completed")return toast("任务已完成");if(t.state==="failed")t.state="running";if(t.step<3){t.step++;t.state="running";}else{t.step=3;t.state="needs_input";t.result=true;}render();toast("已推进演示状态，不代表后台执行。");return;}
if(cmd==="approve"){let t=s.tasks.find(x=>x.id===s.taskId);t.state="completed";t.step=4;t.result=true;s.reportSaved=true;render();toast("演示成果已确认，真实平台需要受控动作和审计。");return;}
if(cmd==="saveReport"){const el=document.getElementById("reportEditor");if(el)s.report=el.value;s.reportSaved=true;render();toast("草稿保存到本次演示状态");return;}
if(cmd==="export")return download();if(cmd==="tabResult"){s.tab="result";return render();}if(cmd==="tabSource"){s.tab="source";return render();}
if(cmd==="filterTasks"){s.search=document.getElementById("taskSearch").value;s.taskFilter=document.getElementById("taskStatus").value;return render();}if(cmd==="filterResults"){s.resultFilter=document.getElementById("resultFilter").value;return render();}
if(cmd==="preview"){s.taskId=+arg;s.tab="result";go("chat");return;}
if(cmd==="goProfile")return go("profile");if(cmd==="goModels")return go("models");
if(cmd==="saveProfile"){s.userName=document.getElementById("personName").value;s.pref=document.getElementById("personPref").value;render();return toast("个人配置已更新（仅模拟）");}
if(cmd==="saveConfig"){s.configSaved=true;render();return toast("示例配置草稿已保存，尚未发布");}
if(cmd==="testConfig"){s.configTested=true;render();return toast("模拟 Agent 验证完成，无真实模型调用");}
if(cmd==="saveProvider"){s.providerName=document.getElementById("providerName").value;s.providerURL=document.getElementById("providerURL").value;s.providerModel=document.getElementById("providerModel").value;render();return toast("模型配置已修改（演示）");}
if(cmd==="testModel"){s.modelTest=true;render();return toast("模拟文本及 Tool Calling 测试通过；不代表真实验证");}
if(cmd==="saveMcp"){s.mcpName=document.getElementById("mcpName").value;s.mcpURL=document.getElementById("mcpURL").value;render();return toast("MCP 示例配置已更新");}
if(cmd==="testMcp"){s.mcpTest=true;render();return toast("模拟 MCP 连接成功，并非真实网络测试");}
if(cmd==="skill"){if(s.enabledSkills.includes(arg))s.enabledSkills=s.enabledSkills.filter(x=>x!==arg);else s.enabledSkills.push(arg);render();return;}
if(cmd==="addKnowledge")return modal("新增知识资源","<p class='muted'>输入演示资源名称；此操作不会上传文件。</p><input class='w100' id='modalText' placeholder='资源名称'>","knowledge","添加");
if(cmd==="deleteKnowledge"){s.knowledge.splice(+arg,1);return render();}
if(cmd==="modelModal")return modal("添加模型服务","<p class='muted'>原型只记录名称，正式版接入需要完整测试及安全凭证管理。</p><input class='w100' id='modalText' placeholder='服务名称'>","provider","添加");
if(cmd==="mcpModal")return modal("添加 MCP 服务","<p class='muted'>新增服务后必须执行健康检查、工具发现及 Root 授权验证。</p><input class='w100' id='modalText' placeholder='MCP 名称'>","mcp","添加");
if(cmd==="userModal")return modal("添加演示用户","<div class='field'><label>邮箱</label><input class='w100' id='modalText' type='email' placeholder='name@example.com'></div><div class='field mt15'><label>角色</label><select id='modalRole' class='w100'><option>用户</option><option>管理员</option></select></div>","user","添加");
if(cmd==="toggleUser"){s.users[+arg].status=s.users[+arg].status==="启用"?"停用":"启用";return render();}
if(cmd==="closeModal"){document.getElementById("modal").innerHTML="";return;}
if(cmd==="confirmModal"){let v=document.getElementById("modalText")?.value.trim();if(!v)return toast("请填写必要内容");if(modalAction==="knowledge")s.knowledge.push(v);if(modalAction==="provider")s.providerName=v;if(modalAction==="mcp")s.mcpName=v;if(modalAction==="user"){if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v))return toast("请填写有效邮箱");s.users.push({name:v.split("@")[0],email:v,role:document.getElementById("modalRole").value,status:"启用"});}render();toast("已添加演示项目");return;}
}
document.addEventListener("click",function(e){let el=e.target.closest("[data-go],[data-action],[data-task],[data-tab],[data-prompt]");if(!el)return;if(el.dataset.go){go(el.dataset.go);return;}if(el.dataset.action){action(el.dataset.action);return;}if(el.dataset.task){taskSelect(+el.dataset.task);return;}if(el.dataset.tab){if(s.tab==="result"){let ed=document.getElementById("reportEditor");if(ed)s.report=ed.value;}s.tab=el.dataset.tab;render();return;}if(el.dataset.prompt){s.draft=el.dataset.prompt;document.getElementById("homePrompt").value=s.draft;return;}});
document.addEventListener("change",function(e){const el=e.target;if(el.id==="role"){s.role=el.value;if(el.value==="admin")s.page="agent";else s.page="home";render();}if(el.dataset.skill){if(el.checked){if(!s.enabledSkills.includes(el.dataset.skill))s.enabledSkills.push(el.dataset.skill);}else s.enabledSkills=s.enabledSkills.filter(x=>x!==el.dataset.skill);}if(el.dataset.cap){if(el.checked){if(!s.capabilities.includes(el.dataset.cap))s.capabilities.push(el.dataset.cap);}else s.capabilities=s.capabilities.filter(x=>x!==el.dataset.cap);}if(el.id==="skillFilter"){s.skillFilter=el.value;render();}if(el.id==="resultFilter"){s.resultFilter=el.value;render();}});
document.getElementById("statePreview").addEventListener("change",function(e){s.viewState=e.target.value;render();});
document.getElementById("mobileMenu").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("reset").addEventListener("click",function(){s=structuredClone(defaults);render();toast("已重置为默认演示数据");});
document.getElementById("filepick").addEventListener("change",function(e){let a=Array.from(e.target.files||[]).map(f=>f.name);s.files=s.files.concat(a);e.target.value="";render();toast("添加了 "+a.length+" 个演示附件名称；文件未上传");});
document.addEventListener("keydown",function(e){if(e.key==="Escape"){document.getElementById("modal").innerHTML="";document.getElementById("sidebar").classList.remove("open");}});
render();
})();
</script></body></html>
