name: ai-protocol-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-aip}"
      POSTGRES_USER: "${POSTGRES_USER:-aip}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aip-local-change-me}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/migrations/001_postgres_documents.sql:/docker-entrypoint-initdb.d/001_postgres_documents.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aip} -d ${POSTGRES_DB:-aip}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        uv run python scripts/seed_selfhost_persistence.py &&
        uv run uvicorn fast_api_app:app --host 0.0.0.0 --port 1956 --workers 1
    environment:
      PORT: "1956"
      LOCAL_MODE: "1"
      LOCAL_MODE_PERSIST: "${LOCAL_MODE_PERSIST:-1}"
      AITANA_LOCAL_SESSION: "memory"
      OTEL_SDK_DISABLED: "true"
      DATA_BACKEND: "${DATA_BACKEND:-memory}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://aip:aip-local-change-me@postgres:5432/aip}"
      POSTGRES_POOL_MIN_SIZE: "${POSTGRES_POOL_MIN_SIZE:-1}"
      POSTGRES_POOL_MAX_SIZE: "${POSTGRES_POOL_MAX_SIZE:-10}"
      MODEL_RESIDENCY_POLICY: "${MODEL_RESIDENCY_POLICY:-unrestricted}"
      GOOGLE_GENAI_USE_VERTEXAI: "false"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_BASE: "${OPENAI_API_BASE:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GROUP_AUTH_SIGNING_SECRET: "${GROUP_AUTH_SIGNING_SECRET:-local-mode-anon-group-dev-secret-DO-NOT-USE-IN-PROD}"
      ALLOW_ORIGINS: "http://localhost:3456"
    ports:
      - "1956:1956"
    volumes:
      - local-state:/root/.aitana-local
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1956/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mcp-sandbox:
    build:
      context: ./infrastructure/mcp-sandbox
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ALLOWED_HOST_ORIGINS: "http://localhost:3456"
    ports:
      - "3457:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/sandbox.html').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LOCAL_MODE: "1"
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:1956"
        NEXT_PUBLIC_MCP_SANDBOX_URL: "http://localhost:3457"
        NEXT_PUBLIC_FRONTEND_URL: "http://localhost:3456"
        NEXT_PUBLIC_BRAND_APP_NAME: "${APP_NAME:-AI Protocol Platform}"
        SKIP_QUALITY_CHECKS: "${SKIP_QUALITY_CHECKS:-false}"
    environment:
      PORT: "8080"
      BACKEND_URL: "http://backend:1956"
    ports:
      - "3456:8080"
    depends_on:
      backend:
        condition: service_healthy
      mcp-sandbox:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  local-state:
    name: ai-protocol-platform-local-state
  postgres-data:
    name: ai-protocol-platform-postgres-data

networks:
  default:
    name: ai-protocol-platform
