name: ai-protocol-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-aip}"
      POSTGRES_USER: "${POSTGRES_USER:-aip}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-aip-local-change-me}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/migrations/001_postgres_documents.sql:/docker-entrypoint-initdb.d/001_postgres_documents.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aip} -d ${POSTGRES_DB:-aip}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command:
      - sh
      - -c
      - >-
        uv run python scripts/apply_selfhost_migrations.py &&
        uv run python scripts/seed_selfhost_persistence.py &&
        uv run python scripts/seed_selfhost_admin.py &&
        uv run uvicorn fast_api_app:app --host 0.0.0.0 --port 1956 --workers 1
    environment:
      PORT: "1956"
      SELF_HOSTED_MODE: "1"
      LOCAL_MODE: "0"
      DATA_BACKEND: "${DATA_BACKEND:-postgres}"
      SESSION_BACKEND: "${SESSION_BACKEND:-postgres}"
      MEMORY_BACKEND: "${MEMORY_BACKEND:-postgres}"
      DATABASE_URL: "${DATABASE_URL:-postgresql://aip:aip-local-change-me@postgres:5432/aip}"
      POSTGRES_POOL_MIN_SIZE: "${POSTGRES_POOL_MIN_SIZE:-1}"
      POSTGRES_POOL_MAX_SIZE: "${POSTGRES_POOL_MAX_SIZE:-10}"
      MEMORY_SEARCH_SCAN_LIMIT: "${MEMORY_SEARCH_SCAN_LIMIT:-2000}"
      OBJECT_STORAGE_BACKEND: "${OBJECT_STORAGE_BACKEND:-local}"
      OBJECT_STORAGE_LOCAL_ROOT: "${OBJECT_STORAGE_LOCAL_ROOT:-/data/objects}"
      ARTIFACT_BACKEND: "${ARTIFACT_BACKEND:-local}"
      ADK_ARTIFACT_ROOT: "${ADK_ARTIFACT_ROOT:-/data/artifacts}"
      MODEL_RESIDENCY_POLICY: "${MODEL_RESIDENCY_POLICY:-unrestricted}"
      PLATFORM_DEFAULT_MODEL: "${PLATFORM_DEFAULT_MODEL:-lite}"
      AUTH_BACKEND: "${AUTH_BACKEND:-local-jwt}"
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-}"
      JWT_PREVIOUS_SIGNING_KEYS: "${JWT_PREVIOUS_SIGNING_KEYS:-}"
      JWT_ISSUER: "${JWT_ISSUER:-ai-protocol-platform}"
      JWT_AUDIENCE: "${JWT_AUDIENCE:-ai-protocol-platform}"
      JWT_EXPIRE_MINUTES: "${JWT_EXPIRE_MINUTES:-60}"
      SELFHOST_ADMIN_EMAIL: "${SELFHOST_ADMIN_EMAIL:-}"
      SELFHOST_ADMIN_PASSWORD: "${SELFHOST_ADMIN_PASSWORD:-}"
      GOOGLE_GENAI_USE_VERTEXAI: "${GOOGLE_GENAI_USE_VERTEXAI:-false}"
      TRACE_EXPORT_ENABLED: "${TRACE_EXPORT_ENABLED:-0}"
      CLOUD_LOGGING_ENABLED: "${CLOUD_LOGGING_ENABLED:-0}"
      VERTEX_SEARCH_ENABLED: "${VERTEX_SEARCH_ENABLED:-0}"
      OTEL_SDK_DISABLED: "${OTEL_SDK_DISABLED:-true}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_BASE: "${OPENAI_API_BASE:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GROUP_AUTH_SIGNING_SECRET: "${GROUP_AUTH_SIGNING_SECRET:-}"
      ALLOW_ORIGINS: "${ALLOW_ORIGINS:-http://localhost:3456}"
    ports:
      - "1956:1956"
    volumes:
      - object-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1956/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mcp-example-map:
    profiles: ["mcp-example"]
    build:
      context: ./infrastructure/mcp-ext-apps-map
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
    expose:
      - "8080"
    restart: unless-stopped

  mcp-sandbox:
    build:
      context: ./infrastructure/mcp-sandbox
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ALLOWED_HOST_ORIGINS: "${MCP_SANDBOX_ALLOWED_HOST_ORIGINS:-http://localhost:3456}"
    ports:
      - "3457:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/sandbox.html').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LOCAL_MODE: "0"
        NEXT_PUBLIC_AUTH_MODE: "${AUTH_BACKEND:-local-jwt}"
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:1956"
        NEXT_PUBLIC_MCP_SANDBOX_URL: "${MCP_SANDBOX_PUBLIC_URL:-http://localhost:3457}"
        NEXT_PUBLIC_FRONTEND_URL: "${FRONTEND_PUBLIC_URL:-http://localhost:3456}"
        NEXT_PUBLIC_DEFAULT_LOCALE: "${DEFAULT_LOCALE:-zh-CN}"
        NEXT_PUBLIC_APP_SLUG: "${APP_SLUG:-platform}"
        NEXT_PUBLIC_CITATION_SCHEME: "${CITATION_SCHEME:-aip}"
        NEXT_PUBLIC_BRAND_APP_NAME: "${APP_NAME:-AI Protocol Platform}"
        NEXT_PUBLIC_BRAND_TAGLINE: "${APP_TAGLINE:-Open Agent Protocol Platform}"
        NEXT_PUBLIC_BRAND_DESCRIPTION: "${APP_DESCRIPTION:-Self-hosted agent platform for Skills, AG-UI, A2UI, MCP and MCP Apps.}"
        NEXT_PUBLIC_BRAND_FAVICON: "${APP_FAVICON:-/images/logo/platform-mark.svg}"
        NEXT_PUBLIC_BRAND_LOGO_HERO: "${APP_LOGO_HERO:-/images/logo/platform-mark.svg}"
        NEXT_PUBLIC_BRAND_LOGO_AVATAR: "${APP_LOGO_AVATAR:-/images/logo/platform-mark.svg}"
        NEXT_PUBLIC_BRAND_EMAIL: "${APP_CONTACT_EMAIL:-}"
        NEXT_PUBLIC_BRAND_GITHUB: "${APP_GITHUB_REPO:-https://github.com/yuklcool/ai-protocol-platform}"
        NEXT_PUBLIC_BRAND_PRIMARY_HSL: "${APP_PRIMARY_HSL:-199 89% 48%}"
        NEXT_PUBLIC_BRAND_PRIMARY_FOREGROUND_HSL: "${APP_PRIMARY_FOREGROUND_HSL:-210 40% 98%}"
        SKIP_QUALITY_CHECKS: "${SKIP_QUALITY_CHECKS:-false}"
    environment:
      PORT: "8080"
      BACKEND_URL: "http://backend:1956"
      MCP_SANDBOX_PUBLIC_URL: "${MCP_SANDBOX_PUBLIC_URL:-http://localhost:3457}"
    ports:
      - "3456:8080"
    depends_on:
      backend:
        condition: service_healthy
      mcp-sandbox:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
    name: ai-protocol-platform-postgres-data
  object-data:
    name: ai-protocol-platform-object-data

networks:
  default:
    name: ai-protocol-platform
