name: ai-protocol-platform

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "1956"
      LOCAL_MODE: "1"
      LOCAL_MODE_PERSIST: "${LOCAL_MODE_PERSIST:-1}"
      AITANA_LOCAL_SESSION: "memory"
      OTEL_SDK_DISABLED: "true"
      # LOCAL_MODE is a development/self-host baseline. Defaulting it to the
      # production fail-safe `eu-strict` would reject most non-Google gateways
      # before the first turn. Production deployments should set their policy
      # explicitly when LOCAL_MODE is removed.
      MODEL_RESIDENCY_POLICY: "${MODEL_RESIDENCY_POLICY:-unrestricted}"
      GOOGLE_GENAI_USE_VERTEXAI: "false"
      # Configure either Gemini, OpenAI, or an OpenAI-compatible endpoint.
      # Empty values are intentional: provider/model selection happens in the
      # model registry and a deployment does not need every provider key.
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_API_BASE: "${OPENAI_API_BASE:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GROUP_AUTH_SIGNING_SECRET: "${GROUP_AUTH_SIGNING_SECRET:-local-mode-anon-group-dev-secret-DO-NOT-USE-IN-PROD}"
      ALLOW_ORIGINS: "http://localhost:3456"
    ports:
      - "1956:1956"
    volumes:
      - local-state:/root/.aitana-local
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1956/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  mcp-sandbox:
    build:
      context: ./infrastructure/mcp-sandbox
      dockerfile: Dockerfile
    environment:
      PORT: "8080"
      ALLOWED_HOST_ORIGINS: "http://localhost:3456"
    ports:
      - "3457:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/sandbox.html').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_LOCAL_MODE: "1"
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:1956"
        NEXT_PUBLIC_MCP_SANDBOX_URL: "http://localhost:3457"
        NEXT_PUBLIC_FRONTEND_URL: "http://localhost:3456"
        NEXT_PUBLIC_BRAND_APP_NAME: "${APP_NAME:-AI Protocol Platform}"
        SKIP_QUALITY_CHECKS: "${SKIP_QUALITY_CHECKS:-false}"
    environment:
      PORT: "8080"
      BACKEND_URL: "http://backend:1956"
    ports:
      - "3456:8080"
    depends_on:
      backend:
        condition: service_healthy
      mcp-sandbox:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  local-state:
    name: ai-protocol-platform-local-state

networks:
  default:
    name: ai-protocol-platform
